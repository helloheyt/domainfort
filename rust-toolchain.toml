# Pinned toolchain — the same exact Rust in CI and on every machine
# (D61; see docs/BUILDING.md). An exact version, not a channel: a floating
# "stable" let CI pick up a newer clippy than the one the gate was run with,
# so a new lint failed CI on unchanged code. Raise it deliberately, together
# with the `dtolnay/rust-toolchain@<version>` lines in .github/workflows/ci.yml.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
