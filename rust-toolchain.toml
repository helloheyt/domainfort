# Pinned toolchain — the same exact Rust in CI and on every machine (docs/14
# D61; A-186). An exact version, not a channel: a floating "stable" let a
# newer clippy (1.100) reach the gate mid-session and fail it on unchanged
# code (class: the gate's own tools drift between runs — AGENTS.md §6.1).
# Raise it deliberately, together with the `dtolnay/rust-toolchain@<version>`
# lines in .github/workflows/ci.yml.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
