# cargo-deny — dependency control (docs/SECURITY-MODEL.md, "Dependencies"; decision D2).
# Run:  cargo deny check
# Fails on a licence not on the list or on an unapproved protocol-logic package.

[licenses]
# The allowed licences only (docs/SECURITY-MODEL.md, "Dependencies"). Anything else (GPL/LGPL/AGPL/MPL/SSPL/unknown) is refused.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.95
# A one-off licence exception needs owner approval — it would be added here explicitly, with a rationale, if ever.
exceptions = []

[licenses.private]
# The allow-list governs what we LINK. Our own workspace crates (all `publish = false`) are covered by
# the repository's LICENSE (AGPL-3.0) and are not checked against it.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"            # no dependency with version "*"
# Our own workspace crates refer to each other by path, without a version. Every workspace crate is
# `publish = false` ("private" to cargo-deny), so those path dependencies are allowed; a public
# crate's path dependency would still be refused.
allow-wildcard-paths = true
# Protocol-logic packages are forbidden without explicit approval (D2): that logic is our own work.
# Linking such a package = someone else's code running in the DC. A list of examples; extended in review.
deny = [
    { name = "krb5" },
    { name = "kerberos" },
    { name = "sspi" },
    { name = "ldap3" },
    { name = "openldap" },
    { name = "smb" },
    { name = "smb2" },
    { name = "pavao" },        # SMB
    { name = "dcerpc" },
    { name = "ndr" },
    { name = "gssapi" },
    { name = "libgssapi" },
    { name = "winrm" },
]

[advisories]
# Known vulnerabilities in dependencies — fails on a vulnerability, does not only warn.
version = 2
yanked = "deny"
ignore = []

[sources]
# Allowed package sources only (the official crates.io).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
