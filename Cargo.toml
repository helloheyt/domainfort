# Workspace — פרצוף נייטיבי (שלב 1) בבנייה. ההתקדמות: docs/45 §10.
#
# גייט ליצירת crates: OD-1 (אישור משפטי) — **נסגר 2026-11-12** ✓.
# ה-crates שב-members לא תלויים בהקלטת-המעבדה. קוד שמול Windows (PAC, NDR,
# פרצוף-Windows) עדיין חסום עד אימות ה-⚠ שלו בהקלטה (docs/44, OD-6).
#
# ה-crates המתוכננים (לפי docs/03-components.md ו-docs/09–11), בסדר קריטיות:
#   C0:  keyd        — משמורת הסודות (docs/10-keyd-interface.md)
#        kdc         — הנפקת אימות (docs/30-kdc-core-flows.md)
#        pdp         — ליבת ההחלטה (docs/11-pdp-interface.md)
#   C1:  dirstore    — אחסון + מודל אבטחה (docs/32 — מעל redb, OD-4)
#        rpc         — DCE/RPC + שירותי RPC
#        repl        — שכפול נייטיבי (docs/29, שלב 4)
#   C2:  parse-*     — parsers מבודדים (asn1, ndr, dns, smb, gss)
#
# כל parser שמול הרשת = crate נפרד, לתהליך נפרד עם sandbox (docs/03 §עקרונות).
#
# תלויות מאושרות (הכרעות 2026-11-12, מקושרות לא-מועתקות — D2; יירשמו ב-Cargo של
# כל crate כשייווצר): redb (אחסון, OD-4); RustCrypto כברירת-מחדל + aws-lc-rs
# כ-backend מאומת-FIPS, ו-rustls ל-TLS (קריפטו/PQC, OD-9/D180).
# הכרעת-בעלים 2026-11-13 (P-12): tokio (runtime אסינכרוני) ו-rustix (זיהוי-עמית בלי unsafe
# בקוד שלנו). כל התלויות יורדות אצל מי שבונה (`scripts/install-deps.sh` / cargo) — שום קוד
# של צד-שלישי לא נמצא במאגר.

[workspace]
resolver = "2"
members = ["crates/parse-asn1", "crates/krb-crypto", "crates/krb-proto", "crates/dtyp", "crates/dirstore", "crates/pdp", "crates/keyd", "crates/kdc", "crates/ad-schema", "crates/directory-pip", "crates/parse-ldap", "crates/ldap", "crates/config", "crates/ipc", "crates/daemon-sandbox", "crates/ipc-keyd", "crates/audit-log", "crates/ipc-audit", "crates/keyd-types", "crates/ipc-keyd-server", "crates/audit-daemon", "crates/keyd-daemon", "crates/ipc-directory", "crates/ipc-directory-server", "crates/directory-daemon", "crates/policy-store", "crates/kdc-daemon", "crates/ipc-ldap", "crates/ipc-ldap-server", "crates/ldap-front", "crates/parse-x509"]

# מדיניות build לכלל ה-workspace (תחול כשייווספו crates):
[workspace.lints.rust]
unsafe_code = "forbid"   # חריג דורש הצדקה כתובה + סוקר שני (AGENTS.md §6)

[workspace.lints.clippy]
all = "warn"
