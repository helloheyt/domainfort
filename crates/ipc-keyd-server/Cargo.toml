# ipc-keyd-server — the server side of the keyd channel against the real,
# in-process keyd: `execute` (one decoded call on keyd with the transport's
# caller and the daemon's clock) and `dispatch` (one request body in, one
# reply frame or a close out) (docs/50 §3.2-§3.7, R50-3, R50-5, R50-7; task
# P5; decision A-58).
#
# Split out of ipc-keyd by D182 / decision A-63: these two functions need the
# real `keyd::Keyd` and so link krb-crypto, which only the keyd process may.
# ipc-keyd keeps the message set, the codec and the client, and depends only
# on the crypto-free keyd-types. A separate crate rather than a cargo feature:
# features are unified across one build, so a `server` feature enabled for the
# keyd-daemon would also reach the kdc-daemon built with it. Only the
# keyd-daemon (task P7) depends on this crate.
#
# Task R6 (docs/52 §3.11, A-102): `classify` decides which calls need their
# intent acknowledged by auditd first; such a call runs only through
# `execute_acknowledged`, which takes an `ipc_audit_client::AckedIntent` by
# value (ipc-audit-client's gate is the only source of one). The unaudited
# `dispatch` is
# behind the `loopback` feature, which no daemon enables (tests only).
#
# Moved unchanged from ipc-keyd's `server` module (written from docs/50,
# docs/10 §2, A-56, A-59 and this project's own crates). No other
# implementation, serializer or RPC framework was consulted or recalled
# (docs/CLEAN-ROOM.md).

[package]
name = "ipc-keyd-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own workspace crates only (path dependencies). No external crate.
#
# The refusal frame and the encoded-frame type (docs/50 §3.3; A-59).
ipc = { path = "../ipc" }
# The channel's message set: `decode_request`, `encode_answer`, `Call`,
# `Answer`, `KEYD_CHANNEL`.
ipc-keyd = { path = "../ipc-keyd" }
# The real keyd: `Keyd` and the bounds of its generics (`KeyStore`,
# `AuditSink`, `EntropySource`), the caller identity. Links krb-crypto — the
# reason this crate is separate (D182; A-63).
keyd = { path = "../keyd" }
# `KerberosTime` (the daemon's clock, R50-5).
krb-proto = { path = "../krb-proto" }
# keyd's record layout on the audit channel (`KeydRecord` and its codes).
# Since task IB1 (docs/questions/Q-851, A-144) the conversion from keyd's
# `AuditRecord` lives HERE (src/audit_convert.rs), on the side that already
# links keyd — not behind an optional feature of ipc-audit, which a shared
# build unified into every daemon. No feature.
ipc-audit = { path = "../ipc-audit" }
# The proof of an acknowledged intent (`AckedIntent`, `IntentRecord`) — task
# R6; crate ipc-audit-client since task IB1 (the gate lives with the one
# client that drives its link side, docs/questions/Q-630, Q-900). Its tokio
# is already linked by keyd-daemon, the only crate that links this one.
ipc-audit-client = { path = "../ipc-audit-client" }

[features]
# The unaudited in-process loopback `dispatch` (keyd run directly, no audit
# gate): tests only — this crate's own tests and keyd-daemon's comparison of
# its engine with it enable it as a dev-dependency feature. No daemon does
# (docs/52 C18: no test seam in a production build).
loopback = []

[dev-dependencies]
# TESTS ONLY (task PN10; docs/59 §7.4): the reused crates/kdc/tests/common fixtures and tests/kdc_flow.rs tag their
# account records' name resolutions with a test key (`test_resolution`) — crate
# name-attestation's `tag`, the signer dird uses. Our own crate; no new
# package.
name-attestation = { path = "../name-attestation" }
# TESTS ONLY, moved with the dispatcher from ipc-keyd: the loopback and
# real-socket tests and the kdc flow through `IpcKeyd`. They reuse the codec
# samples of crates/ipc-keyd/tests/samples (keyd-types, zeroize) and the kdc
# integration fixtures of crates/kdc/tests/common (kdc, pdp, dtyp, and
# krb-crypto to play the Kerberos client) through `#[path]` modules — all
# workspace crates or already in the lock.
keyd-types = { path = "../keyd-types" }
kdc = { path = "../kdc" }
pdp = { path = "../pdp" }
dtyp = { path = "../dtyp" }
krb-crypto = { path = "../krb-crypto" }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# TESTS ONLY: this crate with the loopback `dispatch`; dev-dependencies are
# not linked into a daemon.
ipc-keyd-server = { path = ".", features = ["loopback"] }
# TESTS ONLY (docs/52 C18; docs/questions/Q-843 item 2): the kdc flow builds
# keyd with a deterministic entropy source (`Keyd::with_entropy`, behind
# keyd's `test-seams`). Beside the normal entry; a dev-dependency feature,
# never in a product build (resolver 2).
keyd = { path = "../keyd", features = ["test-seams"] }
# TESTS ONLY (task R15b, docs/questions/Q-630): the proof
# `execute_acknowledged` takes comes only through the real audit client
# (crate ipc-audit-client, a normal dependency above) from an auditd's `Ack`
# — the tests run a fake auditd on a Unix socket (crates/ipc-audit-client
# tests/linked, reused by `#[path]`) and a tokio runtime for the client.
# tokio is P-12's, already in the lock — no new package; dev-dependencies
# are not linked into a daemon.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }

[lints]
workspace = true
