# dns-zone — dnsd's zone image and query answering (docs/54 §4.4, §6.4–§6.6;
# build task DN2; decision A-119).
#
# Pure: no I/O, no sockets, no clock reads (time is a parameter). It holds the
# typed, immutable, bounded `ZoneImage` dnsd answers from, maps every request
# octet string to exactly one verdict (a bounded reply, silence, close, or
# "forward to dird"), and builds every reply as a parse-dns value encoded by
# parse-dns's canonical encoder.
#
# Its dependencies are this workspace's own parse-dns and config (path
# dependencies); no third-party crate is added (AGENTS.md §7).
#
# Written only from RFC 1034 §3.1, §3.6, §3.7–§3.7.2, §4.3.1–§4.3.4; RFC 1035
# §2.3.1–§2.3.4, §3.1–§3.2.5, §3.3, §3.3.11, §3.3.13, §3.4.1, §4.1–§4.1.3,
# §4.2–§4.2.2, §6.2; RFC 2136 §1.1, §2–§2.3, §3, §3.1, §3.3, §3.8, §7.8, §7.11;
# RFC 2782; RFC 4120 §7.2.3–§7.2.3.3; RFC 8945 §4.2, §4.3.1–§4.3.3,
# §5.1–§5.3.2; [MS-ADTS] v20261026 §6.3.2.3, §6.3.2.4 — all opened in-session
# from the pinned copies in tools/spec-pin/cache (SHA-256 verified) — and the
# project's design docs/54 with docs/questions/Q-613, Q-614, Q-616, Q-618,
# Q-642 (AGENTS.md §1-3). No other implementation consulted or recalled.

[package]
name = "dns-zone"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own strict DNS codec (path dependency, same workspace): every request is
# decoded and every reply encoded by it (docs/54 §6.1).
parse-dns = { path = "../parse-dns" }
# Our own zero-dependency, std-only configuration crate (path dependency,
# same workspace): the SRV records' ports are its `StandardPort` — the one
# copy of 88 / 389 / 464, the same value the kdc's, ldap-front's and
# kpasswd-front's listener rule requires (task DN10c; docs/questions/Q-1016
# item 4, decision A-176; Q-1024). Only the constants are used: dns-zone
# still opens, reads and parses no file.
config = { path = "../config" }

[lints]
workspace = true
