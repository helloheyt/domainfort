# cargo-fuzz harness for ipc-dird-admin (docs/CLEAN-ROOM.md: every parser gets a
# fuzz target before it merges to main; docs/51 §7.5 names
# `ipc_dird_admin_request` / `ipc_dird_admin_reply`).
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run ipc_dird_admin_request` / `cargo fuzz run
# ipc_dird_admin_reply` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# docs/CLEAN-ROOM.md). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "ipc-dird-admin-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ipc]
path = "../../ipc"

[dependencies.ipc-dird-admin]
path = ".."

# dird's side: an arbitrary request body through the ipc layer and the typed
# layer, with the canonical round-trip property and the refusal table
# (`cargo fuzz run ipc_dird_admin_request`).
[[bin]]
name = "ipc_dird_admin_request"
path = "fuzz_targets/ipc_dird_admin_request.rs"
test = false
doc = false
bench = false

# admind's side: an arbitrary reply body, decoded as the client decodes it
# (`cargo fuzz run ipc_dird_admin_reply`).
[[bin]]
name = "ipc_dird_admin_reply"
path = "fuzz_targets/ipc_dird_admin_reply.rs"
test = false
doc = false
bench = false

# The effect plan's strict decoder (task MA2; docs/questions/Q-981).
[[bin]]
name = "ipc_dird_admin_plan"
path = "fuzz_targets/ipc_dird_admin_plan.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
