# gss-token — the token framing of the Kerberos V5 GSS-API mechanism for the
# LDAP SASL GSSAPI bind (docs/60 §3.3, §3.4, §10 task LG1; decision A-193;
# docs/questions/Q-1093, Q-1098 item 3).
#
# Leaf crate with ZERO dependencies and NO cryptography: it frames and bounds
# octets and hands back the octet ranges keyd must MAC — it never computes a
# checksum, a hash or a key (docs/60 R60-3, §3.3; D182: only keyd links
# krb-crypto). `tests/no_crypto_dependency.rs` pins this. keyd will link it in
# task LK1.
#
# Scope: RFC 2743 §3.1 context-establishment-token framing (strict decode and
# encode, exact Kerberos V5 mechanism OID of [MS-KILE] 1.9.1), RFC 4121 §4.1
# TOK_IDs (KRB_AP_REQ, KRB_AP_REP — KRB_ERROR is never produced, docs/60 R60-8),
# the RFC 4121 §4.1.1 authenticator checksum (type 0x8003), and the RFC 4121
# §4.2.6.2 Wrap token header without confidentiality with the §4.2.5 RRC
# rotation undone on receipt.
#
# Written only from RFC 2743 §1.1.6/§3.1, RFC 4121 (§2, §4.1–§4.4, §5.2, §6),
# RFC 4752 §3–§3.3, RFC 4120 §5.5.1 and [MS-KILE] v20261110 1.9.1/3.1.1.7/
# 3.4.5.4.1, opened in-session from the pinned cache, and from the project's
# docs/60 / Q-1093 / Q-1098 — AGENTS.md §1-3. No other implementation consulted
# or recalled.

[package]
name = "gss-token"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# intentionally empty — zero runtime dependencies, no crypto (AGENTS.md §7;
# docs/60 §10 LG1: "without cryptography").

[lints]
workspace = true
