# ldap — the LDAP engine: the Policy Enforcement Point behind ldap-front
# (docs/49 R49-16, §11), build task L4: the skeleton (docs/49 §12 "L4").
#
# Pure library: no sockets, no TLS, no clock, no threads, no secret. The
# front (a later crate, L11) owns TCP, rustls and the framer; it hands the
# engine ONE canonical LDAPMessage at a time (parse-ldap's canonical profile,
# R49-16) together with the per-request inputs (policy snapshot, PIP, account
# source, rate limiter, `now`, and the transport facts it observes), and gets
# back zero or more canonical response messages, a connection action
# (Continue / StartTls / Close) and exactly one audit event.
# Task L8 adds Search over the directory (docs/49 R49-9) through the
# request's directory view.
#
# Written only from RFC 4511, RFC 4512 §2.5/§5.1, RFC 4513, RFC 4517 §3.3.16,
# RFC 4422 §3.1, RFC 4752 §3, [MS-ADTS] v20261026 3.1.1.2.2.2, 3.1.1.3.1.3.6,
# 3.1.1.3.1.12, 3.1.1.3.2 (table, .3, .4, .13, .16, .21, .23, .24, .33),
# 3.1.1.3.4.1, 3.1.1.3.4.2, 5.1.1.6, 5.1.2.1, 5.1.2.2, 5.1.3; [MS-DTYP]
# v20241119 2.4.2.4; ITU-T X.680 / X.690 (02/2021); and this project's
# decided design docs/49 (A-45..A-48, A-51, A-52) — AGENTS.md §1-3.

[package]
name = "ldap"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own workspace crates only (path dependencies). No external crate
# (AGENTS.md §7; docs/49 §11).
#
# The canonical LDAP codec: decode one request (canonical profile only,
# R49-16) and encode every response (docs/49 §11).
parse-ldap = { path = "../parse-ldap" }
# The policy decision point (Resource::RootDse, AnonymousGrant — L2).
pdp = { path = "../pdp" }
# `NamedPrincipal` only: a bound identity's (realm, name). Types only; no KDC
# operation is called. NOT the KDC's account source (task PN10b; docs/
# questions/Q-1047, A-187): the per-request re-check of a bound identity
# (docs/49 §4.4, R49-15) reads directory-pip's ticket-subject lookup — the
# same R47-1 name rule (docs/49 §3.2), no attested name resolution.
kdc = { path = "../kdc" }
# KerberosTime (the caller's `now`), Realm and PrincipalName (a bound
# identity's name, as keyd's ServiceContext reports it — L6a/L7).
krb-proto = { path = "../krb-proto" }
# `kerberos_time_seconds` only (the project's one KerberosTime-to-seconds
# scale, also used by kdc); no keyd operation is called in L4. L7 will add
# the `open_and_verify_service_ticket` call behind a trait. The crypto-free
# keyd-types crate, not keyd: this crate links no crypto code (D182; decision
# A-63). Checked by crates/keyd-types/tests/no_crypto_dependency.rs.
keyd-types = { path = "../keyd-types" }
# SIDs for the PDP Subject; GUIDs of directory objects.
dtyp = { path = "../dtyp" }
# Search (task L8, docs/49 R49-9, §11): the per-request directory view (one
# dirstore snapshot that is also the PDP's PIP and, task PN10b, the
# ticket-subject lookup of the re-check — docs/47 §8.1), the naming
# context (A-53) and the DSTIME conversion; the dirstore snapshot it exposes
# (children, lookup_unique, back_links, get_object); the phase-1 schema
# (attributes by lDAPDisplayName, class chains, CLASSATTS, syntaxes).
directory-pip = { path = "../directory-pip" }
dirstore = { path = "../dirstore" }
ad-schema = { path = "../ad-schema" }

[features]
# Exposes `ldap::fuzz_hooks` — the assertion-value parsers of crate::search
# and filter evaluation over a fixed in-memory entry — to the detached fuzz
# workspace `crates/ldap/fuzz` only (AGENTS.md §6: every parser of network
# input gets a fuzz target). No product build enables it; it adds no
# dependency.
fuzz-hooks = []

[dev-dependencies]
# (Task PN10b: no name-attestation — the re-check reads no name resolution,
# so neither the unit tests' subjects nor the directory fixtures' contexts
# carry one; docs/questions/Q-1047, A-187.)
#
# TESTS ONLY (docs/52 C18, task R15; A-113): the tests open their stores by
# path (`Store::open`, feature `test-seams`).
dirstore = { path = "../dirstore", features = ["test-seams"] }

[lints]
workspace = true
