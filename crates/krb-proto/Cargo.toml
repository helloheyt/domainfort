# krb-proto — typed Kerberos V5 messages (RFC 4120 §5) with strict DER decode /
# canonical DER encode, built on our own `parse-asn1` value model.
#
# Scope (this crate): core AS / TGS / AP exchanges, KRB-PRIV, KRB-ERROR, the
# RFC 6113 FAST messages, and the RFC 3244 change-password user data
# (ChangePasswdData, result codes — docs/53 task K1), and the project's single
# definitions of the change-password service name rule and the KerberosTime <->
# seconds pair (docs/questions/Q-955 item 5, A-158; Q-987). KRB-SAFE / KRB-CRED
# are a later task. Encrypted parts stay opaque here; this crate never encrypts or
# decrypts (that is keyd's job via krb-crypto).
#
# Written only from RFC 4120 (§3.5, §5, Appendix A, §7.5), RFC 6113 (§5.2,
# §5.4, §6, §7, Appendix B), RFC 3244 §2, [MS-KILE] 3.1.5.12, ITU-T X.680 /
# X.690 (02/2021) — AGENTS.md §1-3. No other implementation consulted or
# recalled.

[package]
name = "krb-proto"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own strict DER codec (path dependency, same workspace).
parse-asn1 = { path = "../parse-asn1" }
# RustCrypto `zeroize`: wipes EncryptionKey.keyvalue and key-bearing encodings on
# drop (AGENTS.md §6 "secrets"). Approved family under OD-9; sub-crate listed for
# review in docs/questions/PENDING-OWNER.md P-3. License: Apache-2.0 OR MIT.
# No default features: only the `alloc` impls (Vec<u8>) are needed.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[lints]
workspace = true
