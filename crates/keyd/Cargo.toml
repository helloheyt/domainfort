# keyd — the secret-custody core ("compute, don't give"; docs/09, docs/10).
#
# Pure library for the PHASE-1 NATIVE FACE: key store, caller/role model,
# AS / TGS issuance, password set/verify, admin key lifecycle. No sockets, no
# IPC, no daemon (that is a later crate, D34). No PAC (phase 2, D124).
#
# Written only from RFC 4120 (§2, §3.1-3.3, §4, §5.2.7-5.2.9, §5.3-5.5.2,
# §5.9.1, §7.3, §7.5.1, §7.5.3-7.5.5, §7.5.9, §8.2, §10), RFC 3961 §3, RFC 3962
# §4, RFC 6113 (§2.1, §5.1, §5.4-§5.4.6, §6.2, §8 — the FAST armor core and the
# armored AS exchange), [MS-KILE] (FAST
# sections, checked only) and this project's design documents (docs/09,
# docs/10, docs/25 §3, docs/30, docs/33 §6.1, docs/48, docs/49 §3.3 — the
# service-ticket verification core, A-46) — AGENTS.md §1-3. No other
# implementation consulted or recalled. The crypto-free types were split into
# crates/keyd-types (D182; A-63) and the in-process `LocalKeyd` custody moved
# here from crates/kdc — code moved, not rewritten.
#
# Dependencies: our own workspace crates plus RustCrypto `zeroize` (OD-9 /
# D180), linked, never copied. License: MIT OR Apache-2.0. No randomness crate:
# entropy comes from the kernel CSPRNG (/dev/urandom), AGENTS.md §6.

[package]
name = "keyd"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The password policy ([MS-SAMR] 3.1.1.7.2 as phase 1 applies it): a leaf of
# our own workspace — no dependency, no I/O, no crypto. keyd's install path is
# the one place every password is cleartext, so the policy is enforced there
# (task K3; docs/53 §6; docs/questions/Q-605 items 1, 5, A-117). D182 is
# unaffected: it adds no crypto code and no external crate.
admin-password-policy = { path = "../admin-password-policy" }
# The crypto-free types of keyd's interface (ids, roles, errors, operation
# arguments and results, configuration, audit, the `KeyCustody` seam), moved
# out of this crate and re-exported unchanged so that keyd's callers link no
# crypto code (D182; decision A-63).
keyd-types = { path = "../keyd-types" }
# Kerberos AES profile (RFC 3961/3962/8009): string-to-key, random-to-key,
# encrypt/decrypt with integrity, get_mic/verify_mic (constant-time compare).
krb-crypto = { path = "../krb-crypto" }
# Typed RFC 4120 messages with strict DER (EncTicketPart, EncASRepPart, ...).
krb-proto = { path = "../krb-proto" }
# The verifier's side of dird's name-resolution attestation (task PN8;
# docs/59 §7.2, §7.4; decision A-173 — docs/questions/Q-1011): the
# `AttestationKey` keyd holds (installed in the ceremony, never exported) and
# `verify`, whose proof type `AuthenticatedNameResolution` is the only way to
# keyd's `VerifiedNameResolution`. Our own workspace crate; it links
# HMAC-SHA-256 (RustCrypto `hmac` + `sha2`, already in the lock) and the
# crypto-free keyd-types — no new third-party package (AGENTS.md §7). Only
# dird and keyd link it (crates/keyd-types tests/no_crypto_dependency.rs,
# crates/kdc-daemon tests/no_store_or_crypto.rs); keyd never calls its
# signer `tag` (tests/attestation_key_custody.rs).
name-attestation = { path = "../name-attestation" }
# The one name equivalence of the principal namespace (task PN1; docs/59
# §4.2, §7.2; class C49): `StoredKeySet::bound_by` compares the key set's
# bound name with a verified resolution's canonical name by the namespace
# key (`key_of_request`), never octet for octet — keyd holds no second
# equivalence. Our own pure leaf crate (krb-proto, keyd-types; no I/O, no
# crypto, no external crate).
principal-names = { path = "../principal-names" }
# RustCrypto `zeroize` (already in the workspace lock via krb-crypto/krb-proto):
# wipes plaintext passwords, session keys and key-bearing buffers on drop.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[features]
# docs/52 C18 (docs/questions/Q-843 item 2; r4-a CI2): the test seam
# `Keyd::with_entropy` — a constructor that accepts any entropy source —
# exists only in a build that asks for it. Only `[dev-dependencies]` enable
# this feature (cargo's resolver 2 turns a dev-dependency's features on only
# in builds of test targets), so no product build of keyd, or of a daemon
# that links it, can give keyd a source other than the kernel CSPRNG;
# crates/e2e-tests tests/no_test_seams_in_product.rs checks every Cargo.toml
# and every product source. Never in `default`.
test-seams = []

[dev-dependencies]
# TESTS ONLY (docs/52 C18): this crate's own tests inject a deterministic
# entropy source through `Keyd::with_entropy`.
keyd = { path = ".", features = ["test-seams"] }

[lints]
workspace = true
