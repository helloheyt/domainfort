# keyd — the secret-custody core ("compute, don't give"; docs/09, docs/10).
#
# Pure library for the PHASE-1 NATIVE FACE: key store, caller/role model,
# AS / TGS issuance, password set/verify, admin key lifecycle. No sockets, no
# IPC, no daemon (that is a later crate, D34). No PAC (phase 2, D124).
#
# Written only from RFC 4120 (§2, §3.1-3.3, §4, §5.2.7-5.2.9, §5.3-5.5.1,
# §5.9.1, §7.3, §7.5.1, §7.5.9, §8.2, §10), RFC 3961 §3, RFC 3962 §4, RFC 6113
# (§5.1, §5.4-§5.4.6, §6.2, §8 — the FAST armor core), [MS-KILE] (FAST
# sections, checked only) and this project's design documents (docs/09,
# docs/10, docs/25 §3, docs/30, docs/33 §6.1, docs/48) — AGENTS.md §1-3. No
# other implementation consulted or recalled.
#
# Dependencies: our own workspace crates plus RustCrypto `zeroize` (OD-9 /
# D180), linked, never copied. License: MIT OR Apache-2.0. No randomness crate:
# entropy comes from the kernel CSPRNG (/dev/urandom), AGENTS.md §6.

[package]
name = "keyd"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Kerberos AES profile (RFC 3961/3962/8009): string-to-key, random-to-key,
# encrypt/decrypt with integrity, get_mic/verify_mic (constant-time compare).
krb-crypto = { path = "../krb-crypto" }
# Typed RFC 4120 messages with strict DER (EncTicketPart, EncASRepPart, ...).
krb-proto = { path = "../krb-proto" }
# RustCrypto `zeroize` (already in the workspace lock via krb-crypto/krb-proto):
# wipes plaintext passwords, session keys and key-bearing buffers on drop.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[lints]
workspace = true
