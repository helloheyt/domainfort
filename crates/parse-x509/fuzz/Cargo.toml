# cargo-fuzz harness for parse-x509 (AGENTS.md §6 / docs/32 §8: every parser
# gets a fuzz target before it merges to main).
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run parse_x509_certificate` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# AGENTS.md §7). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "parse-x509-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.parse-x509]
path = ".."

# `parse_certificate` on arbitrary octets, with the structural properties of
# an accepted certificate (`cargo fuzz run parse_x509_certificate`).
[[bin]]
name = "parse_x509_certificate"
path = "fuzz_targets/parse_x509_certificate.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
