# parse-x509 — a strict, bounded reader of the X.509 v3 certificate of
# RFC 5280 §4.1 (docs/questions/Q-320; follow-up to Q-285 items 1 and 3,
# decision A-71).
#
# First user: ldap-front's check of the operator-supplied DC certificate
# (docs/50 R50-12, §5.3). Later users: the PKI of docs/35 (chains, PKINIT,
# EST), which will parse certificates that arrive from the network — hence a
# crate of its own, like every network-facing parser (docs/CLEAN-ROOM.md;
# docs/03 §principles), with its own fuzz target.
#
# Leaf crate: its only dependency is this workspace's own strict DER codec,
# so there is nothing third-party to link and nothing for cargo-deny to
# license-check here (docs/CLEAN-ROOM.md). It interprets no algorithm: the
# AlgorithmIdentifier is returned as octets for the caller to compare with
# constants it trusts.
#
# Written only from RFC 5280 (§4.1, §4.1.1.1-§4.1.1.3, §4.1.2.1-§4.1.2.9,
# §4.2, Appendix A.1 / A.2) and ITU-T X.690 / X.680 (02/2021), opened
# in-session from the pinned cache — docs/CLEAN-ROOM.md No other implementation
# consulted or recalled.

[package]
name = "parse-x509"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own strict DER codec (path dependency, same workspace): the element
# reader / writer and the value decoder for the primitive types it covers.
parse-asn1 = { path = "../parse-asn1" }

[lints]
workspace = true
