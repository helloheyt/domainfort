# keyd-daemon — the keyd process (docs/50 §10 task P7; decision A-58): the
# keyd library behind `keyd.sock`, with the caller's role taken only from the
# peer credentials (R50-3), keyd's own clock (R50-5, A-56), the startup
# hold-down from the engine's construction time (R50-6, A-62), one engine
# thread fed by a bounded queue (R50-7), hardening before any thread exists
# (R50-14), the audit channel with the A-57 overflow policy (R50-17), and the
# in-memory INSECURE DEVELOPMENT key store only (R50-18; owner item P-17).
#
# Written only from this project's decided design (docs/50, docs/10,
# docs/questions Q-212, Q-218, Q-222, Q-230, Q-235, Q-240, Q-245, Q-250,
# Q-252, Q-255 and PENDING-OWNER), the public API of the workspace crates
# named below, and the docs.rs API pages of tokio 1.54.1 (API documentation
# only, never source — PENDING-OWNER P-2). No other implementation, daemon,
# server framework or RPC system was consulted or recalled (AGENTS.md §1-3).

[package]
name = "keyd-daemon"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "keyd_daemon"
path = "src/lib.rs"

[[bin]]
name = "keyd-daemon"
path = "src/main.rs"

[dependencies]
# tokio — owner decision P-12 (2026-11-13), the asynchronous runtime for the
# socket side. Linked, never copied; only its docs.rs API pages were read
# (P-2). Version 1.54.1; license (crates.io, as recorded in docs/50 §0.3):
# MIT — on the AGENTS.md §7 allowlist.
#
# Features: a subset of the list docs/50 §10 P0 gives (`rt`,
# `rt-multi-thread`, `net`, `time`, `sync`, `io-util`; never `macros` or
# `full`), each "Available on crate feature …" per the docs.rs pages used:
#   rt      — `runtime::Builder::new_current_thread`, `spawn`, `JoinHandle`;
#   net     — `net::UnixListener`, `net::UnixStream` (`peer_cred`, `UCred`);
#   time    — `time::timeout`, `time::sleep` (frame deadline, backoff);
#   sync    — `sync::mpsc` (the bounded engine queue), `sync::oneshot` (the
#             reply), `sync::Notify` (wake-ups);
#   io-util — `AsyncReadExt::read`, `AsyncWriteExt::write_all`.
# `rt-multi-thread` is not enabled: the daemon runs one current-thread
# runtime next to its one engine thread (R50-7). `signal` is not enabled:
# docs/50 §10 does not list it (SIGTERM handling: docs/questions/Q-260 item 9).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
# RustCrypto `zeroize` (OD-9; already in the workspace lock through keyd,
# ipc and krb-proto): request bodies may carry a password (`set_secret`), so
# every buffer that holds one is wiped on drop (docs/50 §3.3; docs/10 I7).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Our own workspace crates (path dependencies).
#
# Framing (`FrameReader`), the shared `Refused` (A-59).
ipc = { path = "../ipc" }
# The keyd channel: `decode_request`, `encode_answer`, `REQUEST_LIMIT`,
# `KEYD_CHANNEL`.
ipc-keyd = { path = "../ipc-keyd" }
# The server side against the real keyd: `execute`, `Dispatch` (D182, A-63:
# only this daemon depends on it).
ipc-keyd-server = { path = "../ipc-keyd-server" }
# The audit channel and the sender window (A-57). The keyd record
# conversion is crates/ipc-keyd-server's `keyd_record` since task IB1
# (docs/questions/Q-851, A-144: on the side that links keyd, not an
# optional feature of ipc-audit). No feature.
ipc-audit = { path = "../ipc-audit" }
# The one audit client (task R9b — docs/questions/Q-560) and the shared gate
# it drives; crate ipc-audit-client since task IB1. Its tokio is the one
# this daemon already links.
ipc-audit-client = { path = "../ipc-audit-client" }
# The custody engine and its in-memory development store (R50-18).
keyd = { path = "../keyd" }
# `KerberosTime`, `Realm`.
krb-proto = { path = "../krb-proto" }
# `KeydSettings`, `RoleMap` (docs/50 §7.1).
config = { path = "../config" }
# `HardeningPlan`, `SingleThreadProof`, `apply` (R50-14).
daemon-sandbox = { path = "../daemon-sandbox" }
# The protected-file reader (task F7, A-86 follow-up): every file read as
# root before the drop is inspected without following a link, opened with
# O_NOFOLLOW and checked on the opened descriptor. rustix inside (owner
# decision P-12), already in the lock — no new package.
protected-file = { path = "../protected-file" }

[features]
# docs/52 C18 (task R15): the test seams — the module `test_seams` (the full
# parameters, the generic `serve`) — exist only in a build that asks for them.
# Only `[dev-dependencies]` enable this feature (cargo's resolver 2 turns a
# dev-dependency's features on only in builds of test targets), so no product
# build of the daemon contains a seam; crates/e2e-tests
# tests/no_test_seams_in_product.rs checks every Cargo.toml and every product
# source. Never in `default`.
test-seams = []

[dev-dependencies]
# TESTS ONLY (docs/52 C18, task R15): this crate's own tests use its test
# seams (`test_seams`).
keyd-daemon = { path = ".", features = ["test-seams"] }
# TESTS ONLY (task R15b, docs/questions/Q-630): the in-process unit and
# tier-1 tests (src/audit_tests.rs, src/tier1_tests.rs) play the audit
# client at the window level through ipc-audit-client's test seams — the
# shared gate's link side is crate-private to ipc-audit-client. Beside the
# normal entry; a dev-dependency feature, never in a product build
# (resolver 2). cfg-only: it turns on no dependency.
ipc-audit-client = { path = "../ipc-audit-client", features = ["test-seams"] }
# TESTS ONLY: the kdc AS → TGS flow through this daemon reuses the kdc
# integration fixtures (crates/kdc/tests/common) through a `#[path]` module,
# as crates/ipc-keyd-server does — workspace crates or already in the lock.
keyd-types = { path = "../keyd-types" }
kdc = { path = "../kdc" }
pdp = { path = "../pdp" }
dtyp = { path = "../dtyp" }
krb-crypto = { path = "../krb-crypto" }
# TESTS ONLY (decision A-86, tests/intent_before_mutation.rs): the real
# auditd listener and writer (crates/audit-daemon tests/common, reused by
# `#[path]`, as crates/ldap-front does) and the log reader that verifies
# the chain they wrote. Workspace crates — no third-party code.
audit-daemon = { path = "../audit-daemon" }
audit-log = { path = "../audit-log" }
# TESTS ONLY (task R6, docs/52 §3.11): ipc-keyd-server's unaudited loopback
# `dispatch`, which the tier-1 tests compare the engine with — behind its
# `loopback` feature, which no daemon build enables.
ipc-keyd-server = { path = "../ipc-keyd-server", features = ["loopback"] }
# The scratch directories, inside the workspace, of the tests whose files a
# crates/protected-file reader opens — the walk from `/` accepts them (task
# T; docs/questions/Q-480). Dev-only, no dependency.
test-scratch = { path = "../test-scratch" }

# Tier 3 (docs/50 R50-19): the hardening drop runs in a fresh child process of
# a binary with its own `main`, as crates/daemon-sandbox does.
[[test]]
name = "root_hardening"
harness = false

[lints]
workspace = true
