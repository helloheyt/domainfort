# admin-password-policy — the management plane's password rules ([MS-SAMR]
# 3.1.1.7.2 as phase 1 applies them; docs/51 §4.4, §11, R51-5; decisions
# A-79, A-94 on Q-401), shared by admind's `SetPassword` (task A9) and
# `provision first-admin-secret` (task A6, docs/51 §4.3 step 12), so the two
# can never apply different rules.
#
# The code was written for admind in task A9 (crates/admin-daemon
# src/password.rs) and moved here unchanged in task A6; admin-daemon's
# module `password` re-exports it.
#
# A leaf library: no dependency at all, no I/O, no unsafe.
#
# Provenance: written only from [MS-SAMR] v20260427 §3.1.1.7.2 (pinned,
# SHA-256 083fe00a…8a4e verified against tools/spec-pin/manifest.json),
# docs/51 (§4.4, §5.2 row 5, §7.6, §11), docs/37 §2 and the decisions in
# docs/questions/PENDING-OWNER.md (A-79, A-94, P-24) and Q-401. No other
# implementation or password service was consulted or recalled (AGENTS.md
# §1-3).

