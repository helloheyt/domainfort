# dirstore — the directory storage engine (docs/32): objects keyed by a stable
# object GUID, a (parent GUID, RDN key) name index with uniqueness, per-value
# attr-stamps (docs/29 §2), tombstones with explicit purge (docs/29 §5, D121),
# schema as data with write validation (docs/32 §4) and NO secret attributes
# (D44), atomic write transactions (D136), point-in-time snapshots (D39) and an
# HMAC-SHA-256 at-rest integrity tag on every stored record (D135); class
# chains, computed RDN keys, Derived attributes, value ranges / constraints, a
# reverse-link index with referential integrity and unique indexes (docs/46
# §8).
#
# Out of scope here: DN string parsing (the LDAP layer owns it), the
# visibility index (needs the PDP), replication, the AD schema content (the
# separate `ad-schema` crate, docs/46 R46-1).
#
# Written only from this project's design documents (docs/32, docs/29 §2/§5,
# docs/46, docs/12 D44, docs/25 §5, docs/10 D34, docs/11 §6, Q-080), the
# pinned [MS-ADTS] / [MS-DRSR] sections cited in the source, and the public API
# docs of the linked dependencies on docs.rs (PENDING-OWNER P-2) — AGENTS.md
# §1-3.

[package]
name = "dirstore"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own Windows security data types: GUID (object key), SID and
# SECURITY_DESCRIPTOR (value-syntax validation). Path dependency, same workspace.
dtyp = { path = "../dtyp" }
# Embedded KV engine with ACID transactions and MVCC read snapshots — owner
# decision OD-4 (docs/questions/OD-4-kv-engine.md). Linked, never copied; only
# its public API docs were read (P-2). License: MIT OR Apache-2.0. Default
# features (`std`) only: the file-backed database needs std.
redb = "4.5"
# HMAC-SHA-256 for the at-rest integrity tag (D135). RustCrypto, owner decision
# OD-9; already in the workspace lock (krb-crypto). `zeroize`: the MAC state,
# which is derived from the key, is wiped on drop. License: MIT OR Apache-2.0.
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Holds the injected integrity key in a container that is wiped on drop
# (AGENTS.md §6 "secrets"). Fixed-size array only, so no `alloc` feature.
zeroize = { version = "1.9", default-features = false }

[lints]
workspace = true
