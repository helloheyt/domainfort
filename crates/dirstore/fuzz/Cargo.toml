# cargo-fuzz harness for dirstore's record decoder (docs/CLEAN-ROOM.md / docs/32 §8,
# D138: every parser gets a fuzz target before it merges to main). Bytes read
# back from disk are untrusted, so the decoder must never panic, hang or
# over-allocate on any input.
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run dirstore_record_decode` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT /
# Apache-2.0, docs/CLEAN-ROOM.md). It is PENDING OWNER APPROVAL (docs/questions/
# PENDING-OWNER.md, P-1): this harness has not been built or run.

[package]
name = "dirstore-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.dirstore]
path = ".."

[dependencies.dtyp]
path = "../../dtyp"

[[bin]]
name = "dirstore_record_decode"
path = "fuzz_targets/dirstore_record_decode.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
