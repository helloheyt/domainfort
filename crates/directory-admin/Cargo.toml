# directory-admin — the admin plane's write PEP (docs/51 §12, task A3).
#
# A library only: no socket, no thread, no clock (the caller passes `now`).
# dird's admin service (task A8) verifies each AP-REQ through keyd, then
# calls `DirectoryAdmin::prepare` (Subject, PDP, dual control, the [MS-SAMR]
# checks of docs/51 §11, the self-lockout guard; it returns the planned
# `DirAdmin` decision event), sends that event and waits for auditd's
# acknowledgement, then calls `DirectoryAdmin::apply` inside its dirstore
# `WriteTxn` (GUID from the CSPRNG, RID and change-seq from the counters,
# security descriptor, the write itself; it returns the outcome event),
# commits, and sends the outcome event.
#
# Written only from docs/51 (decided A-72) and the decisions A-73..A-79,
# A-83..A-85 and P-22, docs/47, docs/46, docs/11, docs/32, the questions
# Q-290..Q-299, Q-330, Q-335, Q-336, Q-340, the public APIs of this
# workspace's crates, and the pinned [MS-SAMR] v20260427, [MS-ADTS]
# v20261026 and RFC 4120 sections cited in the source, opened in-session from
# tools/spec-pin/cache/ (SHA-256 verified against the manifest) —
# AGENTS.md §1-3. No other implementation was consulted or recalled.

[package]
name = "directory-admin"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own workspace crates only (path dependencies). No external crate
# (AGENTS.md §7).
#
# The directory store: Snapshot, WriteTxn (create / modify / delete), the
# named counters (A-83), NewObject, AttributeChange, Origin.
dirstore = { path = "../dirstore" }
# The phase-1 schema: attribute / class ids by name, class chains,
# schemaIDGUIDs, the groupType / userAccountControl flag values.
ad-schema = { path = "../ad-schema" }
# SID, GUID, SECURITY_DESCRIPTOR and CreateSecurityDescriptor (A-84).
dtyp = { path = "../dtyp" }
# The policy decision point: decide, Subject, Action, Resource, Transport.
pdp = { path = "../pdp" }
# The per-request directory view (AccountSource + Pip over one snapshot),
# the tier map, account_salt, the DSTIME mapping.
directory-pip = { path = "../directory-pip" }
# The AccountSource trait the view implements (the requester's account is
# resolved exactly as the KDC resolves an AS client, docs/51 §5.3).
kdc = { path = "../kdc" }
# keyd's crypto-free types: KeyHandle, KeyPurpose, PrincipalBinding (the
# BeginPasswordSet reply), ServiceContext (the verified ticket's facts) and
# the KerberosTime-to-seconds mapping. NOT keyd and NOT krb-crypto (D182).
keyd-types = { path = "../keyd-types" }
# Realm, PrincipalName, KerberosString, KerberosTime and the name types.
krb-proto = { path = "../krb-proto" }
# Task PN5 (docs/59 §4.2, §5.1; A-173): the one name equivalence of the
# principal namespace. The checker computes every principal's keys with
# `keys_of_names` and writes PRINCIPAL_NAME_KEY itself (N7); A-163's reserved
# names are judged with `reserved_name_of` on those folded keys (class C49);
# `Lookup` probes the namespace with `key_of_request`. Our own leaf crate
# (it links only krb-proto and keyd-types, both already above); no crypto,
# no store, no external crate (AGENTS.md §7).
principal-names = { path = "../principal-names" }
# The `DirAdmin` audit event this crate plans (A-85). No feature.
ipc-audit = { path = "../ipc-audit" }
# The proof of an acknowledged intent `apply` and the decision paths take
# (`AckedIntent`, `IntentRecord` — docs/52 §3.11 R6). Crate ipc-audit-client
# since task IB1 (docs/questions/Q-851, A-144): the gate that alone mints
# the proof lives with the one client that drives its link side
# (docs/questions/Q-630). This links tokio's `net`/`time`/`io-util` (class
# N, P-12) into the crates that link this one — see docs/questions/Q-900.
ipc-audit-client = { path = "../ipc-audit-client" }
# The development policy value and the one tier-map edit both
# policy-change paths share (task A16, docs/51 §5.10: the online
# `PolicyAdmin` path builds `policy.next` with the edit `provision policy`
# uses offline). Our own crate; no crypto, no store.
policy-store = { path = "../policy-store" }
# The effect plan's canonical form and digest (tasks MA2 + MA3; docs/research/
# r5-a-admin-model.md §3.3): the PEP builds the `EffectPlan` whose digest the
# `Commit` names, with the channel's one definition of it — no second
# encoding to drift (docs/52 C14). Our own crate (ipc, dtyp, keyd-types,
# krb-proto, ipc-keyd, zeroize, sha2 and, on Linux, rustix — all already in
# dird's graph); no store, no crypto profile.
ipc-dird-admin = { path = "../ipc-dird-admin" }
# Task DN6: the registrable networks of a host record (docs/54 §5.5;
# Q-614 item 8) are `config::Network` values matched by its one matcher
# (A-114: "one implementation for address matching"). Our own leaf crate,
# zero dependencies, already in dird's graph.
config = { path = "../config" }
# SHA-256 of a pending key-operation request's operation digest (task A10,
# docs/51 §5.6; docs/questions/Q-420). RustCrypto, OD-9; already in the
# workspace lock and already in dird's graph (dirstore links it). License:
# MIT OR Apache-2.0. Called only through its documented `Digest` API
# (docs.rs sha2 0.11.1, as crates/audit-log cites it); no hash is
# implemented here (AGENTS.md §6). Not krb-crypto (D182).
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# TESTS ONLY (docs/52 C18, task R15; A-113): the tests open their stores by
# path (`Store::open`, feature `test-seams`).
dirstore = { path = "../dirstore", features = ["test-seams"] }
# TESTS ONLY (task R15b, docs/questions/Q-630): the proof `apply` takes comes
# only through the real audit client (crate ipc-audit-client, a normal
# dependency above) from an auditd's `Ack` — the tests run a fake auditd on
# a Unix socket (crates/ipc-audit-client tests/linked, reused by `#[path]`):
# its framing (`ipc`) and a tokio runtime for the client. Workspace crates
# and tokio (P-12), already in the lock — no new package; dev-dependencies
# are not linked into any product.
ipc = { path = "../ipc" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }

[lints]
workspace = true
