# directory-pip — the KDC's account source and the PDP's policy information
# point over the directory (docs/47, decided as A-38; R47-11).
#
# One per-request view, built from ONE dirstore snapshot, implements both
# `kdc::AccountSource` and `pdp::Pip`, so the account records the KDC reads
# and the answers the PDP gets come from one consistent picture (docs/47 §8.1;
# docs/11 §6 snapshot semantics).
#
# Pure library: no I/O beyond the dirstore read transaction the caller's
# store hands out, no clock, no randomness, no secret (keys stay in keyd —
# this crate only names key sets by handle).
#
# Written only from docs/47 (R47-1..R47-14, A-38), the decided questions
# Q-110..Q-117 (A-34..A-37), PENDING-OWNER A-18, A-19, A-27..A-38, P-6, P-9,
# and the pinned [MS-KILE] v20260928, [MS-ADTS] v20261026, [MS-SAMR]
# v20260427, [MS-DRSR] v20260309, [MS-DTYP] v20241119 and RFC 4120 sections
# cited in the source, opened in-session from tools/spec-pin/cache/ (SHA-256
# verified against the manifest) — AGENTS.md §1-3.

[package]
name = "directory-pip"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own workspace crates only (path dependencies). No external crate
# (AGENTS.md §7; docs/47 §10.2 "no new external dependency").
#
# The directory store: Snapshot, Object, lookup_unique, back_links,
# lookup_child, get_object.
dirstore = { path = "../dirstore" }
# The phase-1 AD schema content: attribute / class ids by name, class chains,
# property sets, attribute classes.
ad-schema = { path = "../ad-schema" }
# The AccountSource trait and its records (docs/47 §10.1).
kdc = { path = "../kdc" }
# The Pip trait and the request model (Tier, Dn, Resource, ...).
pdp = { path = "../pdp" }
# keyd TYPES only (KeyHandle, KeyPurpose, PrincipalId, KeydConfig) and the
# public KerberosTime-to-seconds mapping; no keyd operation is called. The
# crypto-free keyd-types crate, not keyd: this crate links no crypto code
# (D182; decision A-63). Checked by
# crates/keyd-types/tests/no_crypto_dependency.rs.
keyd-types = { path = "../keyd-types" }
# Kerberos names, KerberosString, KerberosTime, ETYPE-INFO2 entries
# (the AccountSource signature types; docs/47 §10.2).
krb-proto = { path = "../krb-proto" }
# GUID, SID and SECURITY_DESCRIPTOR.
dtyp = { path = "../dtyp" }
# Task DN6 (docs/54 §4.4; decision A-119): the zone projection builds dnsd's
# `ZoneImage` with the zone crate's own validating constructor, and the host
# rules (LDH label, allowed address, ≤ 8 addresses) are the zone crate's —
# one statement of each (docs/52 C14). Our own leaf crates, no I/O: dns-zone
# links only parse-dns, which links nothing.
dns-zone = { path = "../dns-zone" }
# The DNS names of the image (apex, RNAME) — the type `ZoneImage` takes.
parse-dns = { path = "../parse-dns" }
# The one implementation of address-in-network matching (`Network::contains`,
# A-114: "one implementation for address matching") for the registrable
# networks of a host record (docs/54 §5.5; Q-614 item 8). Zero dependencies.
config = { path = "../config" }
# Task PN1 (docs/59 §4.2-§4.4, §8; A-173): the one name equivalence of the
# principal namespace — the fold, the request key, the keys an object's
# stored names produce and the realm alias set (src/principal.rs) — and,
# from task PN4 (docs/59 §6), the one lookup path by name built on it
# (src/resolve.rs). Our own crypto-free leaf crate: it links only krb-proto
# and keyd-types, which this crate links already.
principal-names = { path = "../principal-names" }

[dev-dependencies]
# TESTS ONLY (task PN10; docs/59 §7.4): the shared test signer (tests/common/signer.rs) tags the resolutions the
# account records carry with a test key, as dird's signer does with its own — crate
# name-attestation's `tag`, the signer dird uses. Our own crate; no new
# package.
name-attestation = { path = "../name-attestation" }
# TESTS ONLY (docs/52 C18, task R15; A-113): the tests open their stores by
# path (`Store::open`, feature `test-seams`).
dirstore = { path = "../dirstore", features = ["test-seams"] }
# TESTS ONLY: the real in-process keyd behind the KDC of the AS -> TGS round
# trip (`keyd::Keyd`, `keyd::LocalKeyd`); the tests also name keyd's types
# through keyd's re-exports (the same items as keyd-types').
keyd = { path = "../keyd" }
# TESTS ONLY, as for the kdc tests (main-session decision 2): the AS -> TGS
# round trip plays the Kerberos client — derives the client key from the
# password and the ETYPE-INFO2 salt, builds PA-ENC-TIMESTAMP and the TGS
# authenticator, opens the replies. The product library never links it.
krb-crypto = { path = "../krb-crypto" }

[lints]
workspace = true
