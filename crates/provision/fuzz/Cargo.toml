# cargo-fuzz harness for provision's password-file reader (task A6, docs/51
# §12: "`provision first-admin-secret` … + fuzz for the password-file
# reader"; docs/CLEAN-ROOM.md: every parser gets a fuzz target before it merges to
# main; docs/50 §9).
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run provision_password_file` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT /
# Apache-2.0, docs/CLEAN-ROOM.md). It is PENDING OWNER APPROVAL (docs/questions/
# PENDING-OWNER.md, P-1): this harness has been written, not built or run.

[package]
name = "provision-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.provision]
path = ".."

# The password-file content rule on arbitrary octets
# (`cargo fuzz run provision_password_file`).
[[bin]]
name = "provision_password_file"
path = "fuzz_targets/provision_password_file.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
