# dtyp — strict, bounded parser and canonical encoder for the Windows security
# data types the directory and the PDP need: GUID (packet form), SID (packet and
# "S-1-..." string form), ACCESS_MASK, ACE, ACL and the self-relative
# SECURITY_DESCRIPTOR.
#
# Leaf crate: ZERO runtime dependencies (the error enum is hand-rolled), so there
# is nothing to link and nothing for cargo-deny to license-check here.
# Written only from [MS-DTYP] v20241119 (protocol revision 42.0) sections 2.1,
# 2.3.4, 2.4.1-2.4.6 and 2.5.1.4 — AGENTS.md §1-3. The access-check algorithm
# (MS-DTYP 2.5.3) is NOT here; it belongs to the next crate (pdp).

[package]
name = "dtyp"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# intentionally empty — zero runtime dependencies (AGENTS.md §7; docs/45 §4).

[lints]
workspace = true
