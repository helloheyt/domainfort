# kdc-daemon — the KDC process (docs/50 §10 task P9; decision A-58): the kdc
# library behind UDP and TCP listeners on the configured internal interface
# addresses (RFC 4120 §7.2.1, §7.2.2; docs/50 R50-9, §4.1), one engine thread
# that owns the `Kdc` and is fed by two bounded queues (AS, TGS) chosen by the
# first identifier octet only, keyd over `keyd.sock` (`ipc_keyd::IpcKeyd`,
# R50-3, R50-8), the directory over `dird-kdc.sock` (a view pinned per
# request, R50-2), the shared UNSIGNED development policy file
# (crates/policy-store, A-68) whose version must equal dird's, per-source and
# per-connection limits, hardening before any thread exists (R50-14), and the
# audit channel with the A-57 gate (R50-17).
#
# Holds no key (docs/30 §1) and links no crypto (D182), no store (R50-2): see
# tests/no_store_or_crypto.rs.
#
# Written only from this project's decided design (docs/50, docs/07 §1,
# docs/questions Q-217, Q-218, Q-219, Q-222, Q-223, Q-230, Q-252, Q-260,
# Q-265, Q-270 and PENDING-OWNER), RFC 4120 §5.4.1 and §7.2 (pinned copy),
# ITU-T X.690 8.1.2 (pinned copy), the public API of the workspace crates
# named below, and the docs.rs API pages of tokio 1.54.1 (API documentation
# only, never source — PENDING-OWNER P-2). No other implementation, KDC,
# daemon, server framework or RPC system was consulted or recalled
# (docs/CLEAN-ROOM.md).

[package]
name = "kdc-daemon"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "kdc_daemon"
path = "src/lib.rs"

[[bin]]
name = "kdc-daemon"
path = "src/main.rs"

[dependencies]
# tokio — owner decision P-12, the asynchronous runtime for the network
# side. Linked, never copied; only its docs.rs API pages were read (P-2).
# Version 1.54.1; license MIT (docs/50 §0.3) — on the docs/CLEAN-ROOM.md
# allowlist. Features: the subset the other daemons use, from docs/50 §10
# P0's list (never `macros` or `full`):
#   rt      — `runtime::Builder::new_current_thread`, `spawn`, `JoinHandle`;
#   net     — `net::UdpSocket`, `net::TcpListener`, `net::TcpStream`
#             (`from_std`), `net::UnixStream` (the audit channel, `peer_cred`);
#   time    — `time::timeout`, `time::sleep`;
#   sync    — `sync::oneshot` (the engine's answer), `sync::Notify`;
#   io-util — `AsyncReadExt::read`, `AsyncWriteExt::write_all`.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
# Our own workspace crates (path dependencies).
#
# The KDC library: `Kdc::handle`, `reject_frame`, the TCP record framing
# (`tcp_decode_frame`, `tcp_encode_frame`), `PolicyInputs`, `RateLimiter`,
# `AuditSink`.
kdc = { path = "../kdc" }
# keyd's crypto-free types: `KeyCustody` and its errors (the gate wrapper).
keyd-types = { path = "../keyd-types" }
# The keyd channel's client (`IpcKeyd`, `KeydClient`, `UnixConnector`).
ipc-keyd = { path = "../ipc-keyd" }
# The directory channel's client (`DirectoryClient`, `RemoteView`,
# `UnavailableDirectory`, `UnixConnector`).
ipc-directory = { path = "../ipc-directory" }
# The audit channel and the sender window (A-57). Since task IB1
# (docs/questions/Q-851, A-144) the kdc event conversion lives HERE
# (src/audit_convert.rs), on the side that already links kdc, pdp and
# krb-proto — not behind an optional feature of ipc-audit, which a shared
# build unified into every daemon (and so put keyd, krb-crypto and dirstore
# into this one). No feature.
ipc-audit = { path = "../ipc-audit" }
# The one audit client (task R9b — docs/questions/Q-560) and the shared gate
# it drives; crate ipc-audit-client since task IB1. Its tokio is the one
# this daemon already links.
ipc-audit-client = { path = "../ipc-audit-client" }
# The shared policy file (A-68).
policy-store = { path = "../policy-store" }
# `PolicySnapshot`, `IpScope`, `RlKey`.
pdp = { path = "../pdp" }
# `KerberosTime`.
krb-proto = { path = "../krb-proto" }
# `KdcSettings`.
config = { path = "../config" }
# `HardeningPlan`, `SingleThreadProof`, `apply` (R50-14).
daemon-sandbox = { path = "../daemon-sandbox" }
# The protected-file reader (task F7, A-86 follow-up): every file read as
# root before the drop is inspected without following a link, opened with
# O_NOFOLLOW and checked on the opened descriptor. rustix inside (owner
# decision P-12), already in the lock — no new package.
protected-file = { path = "../protected-file" }
# `SourceLimiter`, `SourceLimits`: the UDP per-source + global admission
# check, moved out of src/rate.rs unchanged by task DN3 so that dnsd shares
# the one mechanism (docs/54 §6.7, §10). A leaf: no dependency at all.
rate-limit = { path = "../rate-limit" }

[features]
# docs/52 C18 (task R15): the test seams — the module `test_seams` (the full
# parameters, the generic `serve`) — exist only in a build that asks for them.
# Only `[dev-dependencies]` enable this feature (cargo's resolver 2 turns a
# dev-dependency's features on only in builds of test targets), so no product
# build of the daemon contains a seam; crates/e2e-tests
# tests/no_test_seams_in_product.rs checks every Cargo.toml and every product
# source. Never in `default`.
test-seams = []

[dev-dependencies]
# TESTS ONLY (task PN10; docs/59 §7.4): the reused crates/kdc/tests/common fixtures tag their account records' name
# resolutions with a test key (`test_resolution`) — crate
# name-attestation's `tag`, the signer dird uses. Our own crate; no new
# package.
name-attestation = { path = "../name-attestation" }
# TESTS ONLY (docs/52 C18, task R15): this crate's own tests use its test
# seams (`test_seams`).
kdc-daemon = { path = ".", features = ["test-seams"] }
# TESTS ONLY (task R15b, docs/questions/Q-630): the in-process unit tests of
# the gate wrapper (src/audit_tests.rs) open the gate as the audit client
# does, through ipc-audit-client's test seams — the shared gate's link side
# is crate-private to ipc-audit-client. Beside the normal entry; a
# dev-dependency feature, never in a product build (resolver 2). cfg-only:
# it turns on no dependency.
ipc-audit-client = { path = "../ipc-audit-client", features = ["test-seams"] }
# TESTS ONLY. The flows run the real keyd daemon and the real dird
# (crates/keyd-daemon and crates/directory-daemon tests/support, reused by
# `#[path]`) and reuse the kdc integration fixtures (crates/kdc/tests/common,
# the Kerberos client side with krb-crypto), as crates/directory-daemon
# does. Every one is a workspace crate or already in the lock.
keyd-daemon = { path = "../keyd-daemon", features = ["test-seams"] }
directory-daemon = { path = "../directory-daemon", features = ["test-seams"] }
# `test-seams` (docs/52 C18; docs/questions/Q-843 item 2): the tests build keyd
# with a deterministic entropy source (`Keyd::with_entropy`, directly or through
# the reused crates/kdc tests/common fixtures). Dev-only (resolver 2).
keyd = { path = "../keyd", features = ["test-seams"] }
krb-crypto = { path = "../krb-crypto" }
# `test-seams` (A-113, R15): the reused dird support opens its store by path
# (`Store::open`); without it `cargo test -p kdc-daemon` alone did not build
# (fixed in task R15b — feature unification hid it in workspace builds).
dirstore = { path = "../dirstore", features = ["test-seams"] }
directory-pip = { path = "../directory-pip" }
ad-schema = { path = "../ad-schema" }
dtyp = { path = "../dtyp" }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Framing and the shared `Refused` for the reused supports' fake auditd and
# raw clients (it was a normal dependency for the kdc's own audit client,
# which is now crate ipc-audit's — task R9b).
ipc = { path = "../ipc" }
# The scratch directories, inside the workspace, of the tests whose files a
# crates/protected-file reader opens — the walk from `/` accepts them (task
# T; docs/questions/Q-480). Dev-only, no dependency.
test-scratch = { path = "../test-scratch" }

# Tier 3 (docs/50 R50-19): the hardening drop runs in a fresh child process of
# a binary with its own `main`, as the other daemons do.
[[test]]
name = "root_hardening"
harness = false

[lints]
workspace = true
