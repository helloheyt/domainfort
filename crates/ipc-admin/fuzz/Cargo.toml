# cargo-fuzz harness for ipc-admin (AGENTS.md §6: every parser gets a fuzz
# target before it merges to main; docs/51 §7.6: "crate `ipc-admin` + fuzz
# targets").
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run ipc_admin_request` / `cargo fuzz run ipc_admin_reply`
# (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# AGENTS.md §7). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "ipc-admin-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ipc]
path = "../../ipc"

[dependencies.ipc-admin]
path = ".."

# admind's side: an arbitrary request body through the ipc layer and the
# typed layer, with the canonical round-trip property and the refusal table
# (`cargo fuzz run ipc_admin_request`).
[[bin]]
name = "ipc_admin_request"
path = "fuzz_targets/ipc_admin_request.rs"
test = false
doc = false
bench = false

# A client's side: an arbitrary reply body, decoded as a client decodes it
# (`cargo fuzz run ipc_admin_reply`).
[[bin]]
name = "ipc_admin_reply"
path = "fuzz_targets/ipc_admin_reply.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
