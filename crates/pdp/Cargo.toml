# pdp — the central Policy Decision Point (docs/11-pdp-interface.md, C0 core).
#
# A PURE library: decide() is a total, deterministic function of
# (AccessRequest, PolicySnapshot, Pip). No clock reads, no randomness, no
# global state, no I/O. The decision cache / invalidation of docs/11 §9 (D41)
# is out of scope: this core is stateless.
#
# Dependencies: the workspace crate `dtyp` (path) ONLY — zero external crates
# (AGENTS.md §7; docs/45 §4 "zero or minimal runtime dependencies").
#
# Written only from [MS-DTYP] v20241119 (rev 42.0) §2.3.4, 2.3.9, 2.4.2.4,
# 2.4.3, 2.4.4.1, 2.4.4.3, 2.4.4.5, 2.4.5, 2.4.6, 2.5.2, 2.5.3, 2.5.3.1.1,
# 2.5.3.1.3, 2.5.3.1.4, 2.5.3.2; [MS-ADTS] v20261026 (rev 70.0) §3.1.1.2.3.3,
# 3.1.1.2.4.3, 3.1.1.4.3, 3.1.1.4.4, 3.1.1.5.2.1, 3.1.1.5.5.4, 5.1.3, 5.1.3.1,
# 5.1.3.2, 5.1.3.2.1, 5.1.3.3, 5.1.3.3.1-5.1.3.3.4, 5.1.3.3.6, 6.1.3, 6.1.3.4,
# 6.1.1.2.6.18; [MS-ADA1] v20180912 §2.185; project decisions A-21, A-22,
# A-28; the Q-127 interim decision (owner item P-10, mandatory FAST); and the
# project design docs/05, 06, 11, 25 §5.1, 48 §7 — AGENTS.md §1-3.

