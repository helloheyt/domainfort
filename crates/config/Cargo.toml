# config — the strict, hand-parsed daemon configuration (docs/50 R50-15, §7.1;
# build task P2 of docs/50 §10).
#
# One file per daemon (keyd, dird, kdc, ldap-front, auditd, admind), each a
# closed table of typed `key = value` settings. No environment overrides, no
# includes, numeric uids/gids, and no secrets — only paths to protected files.
#
# Leaf crate: ZERO runtime dependencies (hand-rolled error enum, std only), so
# there is nothing to link and nothing for cargo-deny to license-check here
# (docs/CLEAN-ROOM.md; docs/50 §10: "lib, leaf, —").
# Written only from the project's decided design docs/50 (A-58) and the
# decisions it cites, opened in-session — docs/CLEAN-ROOM.md

[package]
name = "config"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# intentionally empty — zero runtime dependencies (docs/CLEAN-ROOM.md; docs/50 R50-15).

[lints]
workspace = true
