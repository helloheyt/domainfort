# cargo-fuzz harness for config (AGENTS.md §6 / docs/32 §8: every parser gets a
# fuzz target before it merges to main; docs/50 R50-15, §9: `config_file`).
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run config_file` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# AGENTS.md §7). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "config-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.config]
path = ".."

# Every daemon's schema on arbitrary octets, with the invariants of accepted
# files (`cargo fuzz run config_file`; docs/50 §9).
[[bin]]
name = "config_file"
path = "fuzz_targets/config_file.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
