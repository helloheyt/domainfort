# audit-daemon — the auditd process (docs/50 R50-1, R50-17, §8, §10 task P6b):
# verifies the hash-chained audit log at start (and recovers a torn tail by
# starting a new segment), hardens the process, then listens on `audit.sock`
# and appends every mapped daemon's events through one bounded writer that
# acknowledges only synced records.
#
# Written only from this project's decided design — docs/50 (A-58), docs/37,
# docs/07 §8, docs/questions Q-218 (A-57), Q-230 (A-60), Q-235 (A-61), Q-250 /
# Q-252 (A-64), Q-251 (P-20) — the public API of the workspace crates named
# below, and the docs.rs API pages of tokio 1.54.1 (P-2; never its source).
# No existing log daemon, journal or audit implementation was consulted or
# recalled (AGENTS.md §1-3).

[package]
name = "audit-daemon"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "audit-daemon"
path = "src/main.rs"

[dependencies]
# The log format, writer and verifier (docs/50 §8.1; Q-250).
audit-log = { path = "../audit-log" }
# The `audit.sock` message set and the per-connection sequence check. Core
# only: no kdc / keyd / ldap conversions in this process (docs/questions/Q-252
# item 1; D104 minimality).
ipc-audit = { path = "../ipc-audit", default-features = false }
# Framing, the shared `Refused` reply (A-59).
ipc = { path = "../ipc" }
# `AuditdSettings` and the `uid → source` map (docs/50 R50-15, §3.2; A-60).
config = { path = "../config" }
# Process hardening before any thread (docs/50 R50-14; A-61).
daemon-sandbox = { path = "../daemon-sandbox" }
# The protected-file reader (task F7, A-86 follow-up): every file read as
# root before the drop is inspected without following a link, opened with
# O_NOFOLLOW and checked on the opened descriptor. Task R11b: the log's
# segments too, after the drop — listed, read, appended to and created
# through its walk (`for_each_entry_beside`, `open`, `open_append`,
# `create_new_append`). rustix inside (owner decision P-12), already in the
# lock — no new package.
protected-file = { path = "../protected-file" }
# The async runtime — owner decision P-12 (2026-11-13), linked never copied;
# only its docs.rs API pages were read (P-2). Version 1.54.1, license "MIT"
# (crates.io metadata, 2026-11-13; on the AGENTS.md §7 allowlist). Features:
# exactly the docs/50 §10 P0 set, no `macros` / `full`:
#   rt              — `runtime::Builder`, `Runtime::spawn` / `enter`;
#   rt-multi-thread — `Builder::new_multi_thread` (the writer holds the main
#                     thread, so the runtime needs its own workers);
#   net             — `net::UnixListener`, `net::UnixStream`, `peer_cred`;
#   time            — `time::timeout_at`, `time::sleep`, `time::Instant`;
#   sync            — `sync::oneshot` (the writer's reply to a connection);
#   io-util         — `AsyncReadExt::read`, `AsyncWriteExt::write_all`.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util"] }

[dev-dependencies]
# The scratch directories, inside the workspace, of the tests whose files a
# crates/protected-file reader opens — the walk from `/` accepts them (task
# T; docs/questions/Q-480). Dev-only, no dependency.
test-scratch = { path = "../test-scratch" }

[lints]
workspace = true
