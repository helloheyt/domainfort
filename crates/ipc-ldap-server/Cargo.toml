# ipc-ldap-server — dird's side of the ldap-front ↔ dird channel: a pure
# dispatcher that decodes a request body, keeps the channel's order (Open
# first, TlsEstablished only after StartTls, one session per connection),
# runs the `ldap::Engine` over the connection's `ldap::Session` with the
# inputs dird supplies, and encodes the reply (docs/50 R50-10, §4.2, §4.3,
# §10 "P10"; docs/49 R49-16; decision A-58).
#
# A separate crate, not a feature of ipc-ldap: cargo unifies a package's
# features across one build, so a `server` feature turned on for dird would
# also be on for ldap-front in a workspace build and link the engine,
# dirstore / redb and directory-pip into the front process (the reason A-63
# split ipc-keyd-server and A-68 ipc-directory-server). Only the dird daemon
# depends on this crate.
#
# Written only from this project's decided design — docs/50 (R50-7, R50-10,
# §3.3, §4.2, §4.3, §8.2, §9, §10), docs/49 (R49-14, R49-15, R49-16, §4.3,
# §4.4, §11), docs/questions Q-163 (A-47), Q-190 (A-54), Q-200 (A-55), Q-225
# (A-59), Q-270 (A-68), PENDING-OWNER — and the code of this project's crates
# (ipc, ipc-ldap, ldap, parse-ldap, pdp; ipc-directory-server as the
# pattern). No other implementation, LDAP server or RPC framework was
# consulted or recalled (AGENTS.md §1-3).

[package]
name = "ipc-ldap-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Framing, the envelope, the shared `Refused` (docs/50 §3.3; A-59).
ipc = { path = "../ipc" }
# The channel: message sets, bounds, the response-part rule.
ipc-ldap = { path = "../ipc-ldap" }
# The engine (the PEP): `Engine`, `Session`, `Listener`, `Outcome`,
# `ConnectionAction`, `TransportReport`, `RequestInputs`, and the search
# limits the channel's bounds are pinned to.
ldap = { path = "../ldap" }
# `AuthState` (the framing state reported to the front).
parse-ldap = { path = "../parse-ldap" }
# `IpScope` (the zone dird derives from the peer address).
pdp = { path = "../pdp" }

[dev-dependencies]
# TESTS ONLY (task PN10; docs/59 §7.4): the reused crates/directory-pip tests/common fixtures sign their contexts'
# name resolutions with the shared test signer (tests/common/signer.rs) — crate
# name-attestation's `tag`, the signer dird uses. Our own crate; no new
# package.
name-attestation = { path = "../name-attestation" }
# TESTS ONLY (task PN10): the resolution type the shared test signer
# returns (crates/directory-pip tests/common/signer.rs). Our own crate,
# already in the graph through ldap.
keyd-types = { path = "../keyd-types" }
# TESTS ONLY: the directory fixtures of crates/directory-pip/tests/common
# (reused through `#[path]`) build a temporary dirstore with the phase-1
# schema and name keyd's configuration through keyd's re-exports; the
# security descriptors, SIDs and names come from dtyp / krb-proto; the view
# and the naming context from directory-pip. Workspace crates or already in
# the lock.
ad-schema = { path = "../ad-schema" }
directory-pip = { path = "../directory-pip" }
# `test-seams` (A-113, R15): the reused fixtures open their store by path
# (`Store::open`); without it `cargo test -p ipc-ldap-server` alone did not
# build (task R15b, docs/questions/Q-634).
dirstore = { path = "../dirstore", features = ["test-seams"] }
keyd = { path = "../keyd" }
krb-proto = { path = "../krb-proto" }
dtyp = { path = "../dtyp" }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[lints]
workspace = true
