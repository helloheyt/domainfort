# ipc — the hand-defined IPC framing and field codec primitives (docs/50 §3.3,
# R50-4; runtime build task P1, docs/50 §10).
#
# The shared layer under every local channel (keyd.sock, dird-*.sock,
# audit.sock): the u32 length prefix, the magic / version / kind envelope,
# canonical fixed-order field primitives with exactly one encoding per value,
# and the shared `Refused` reply. No serializer framework and no serde
# (D34, docs/10 §3: "not a general serializer — that is itself attack surface").
# The per-channel message sets (ipc-keyd, ipc-directory, ...) are later crates.
#
# Leaf crate. One dependency: RustCrypto `zeroize` (OD-9 / D180; already in the
# workspace lock via krb-crypto / krb-proto / keyd), linked and never copied,
# for the buffers that may hold secrets (R50-4; docs/10 I7). License: MIT OR
# Apache-2.0. Written only from this project's decided design (docs/50 §3,
# §10; docs/10 §2-§3, D34) and the docs.rs API pages of `zeroize` (P-2) —
# docs/CLEAN-ROOM.md No other implementation consulted or recalled.

[package]
name = "ipc"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Zeroizing frame / writer buffers and the `Secret` byte string (R50-4).
# `alloc`: the `Zeroize` impl for `Vec<u8>` (docs.rs zeroize 1.9.1).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[lints]
workspace = true
