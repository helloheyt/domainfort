# parse-ldap — the strict LDAP-BER message codec (docs/49 R49-1..R49-3, task L1).
#
# A separate network-facing parser crate (docs/49 §2.2 option B): `parse-asn1`
# stays DER-only inside the keyd TCB and is not touched. This crate decodes the
# RFC 4511 §5.1 BER subset with the A-45 profile choices (docs/questions/Q-160)
# and encodes the canonical form the front hands to the engine (R49-16).
#
# Leaf crate: ZERO runtime dependencies (hand-rolled error enum), nothing to link
# and nothing for cargo-deny to license-check here (docs/CLEAN-ROOM.md).
# Written only from RFC 4511, RFC 4512 §1.4/§2.5, ITU-T X.690 / X.680 (02/2021)
# and [MS-ADTS] 3.1.1.3.4.6 / 6.3.3, opened in-session — docs/CLEAN-ROOM.md

[package]
name = "parse-ldap"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# intentionally empty — zero runtime dependencies (docs/CLEAN-ROOM.md; docs/49 §11).

[lints]
workspace = true
