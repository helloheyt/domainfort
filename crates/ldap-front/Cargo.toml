# ldap-front — the LDAP network front-end (docs/50 §10 task P11 = docs/49
# L11; decision A-58): TCP listeners for LDAP with StartTLS and for LDAPS
# (docs/50 §4.2), TLS through rustls exactly as docs/50 R50-11 sets it
# (TLS 1.3 only, AES-GCM, X25519MLKEM768 → X25519 → SECP256R1, no 0-RTT,
# no tickets / resumption, no key log, no secret extraction, no certificate
# compression, no client certificates), the operator-supplied DC certificate
# and key (R50-12), the framer with dird's framing state, the wire →
# canonical re-encoding (docs/49 R49-16), one Unix connection to dird per
# client connection (R50-10), the StartTLS hand-over order of docs/50 §4.3,
# connection limits and timeouts (§4.2), hardening before any thread exists
# (R50-14) and the start-up order of R50-16.
#
# Links no LDAP engine, no store and no keyd (docs/49 R49-16: "ldap-front —
# TLS + parse-ldap, no dirstore, no keyd"; docs/25 §3.3) — checked by
# tests/no_engine_dependency.rs.
#
# Written only from this project's decided design (docs/50, docs/49,
# docs/questions Q-162, Q-163, Q-185, Q-221, Q-230, Q-280 and PENDING-OWNER
# P-2, P-12, P-15, P-21, A-47, A-52, A-57, A-58, A-70), RFC 4511, RFC 4513,
# RFC 8446 and RFC 5929 sections opened in-session from the pinned cache,
# the public API of the workspace crates named below, and the docs.rs API
# pages of tokio 1.54.1, rustls 0.23.46, rustls-pki-types 1.16.0, aws-lc-rs
# 1.19.0 and zeroize 1.9.1 (API documentation only, never source —
# PENDING-OWNER P-2). No other implementation, TLS-terminating proxy, LDAP
# server or daemon was consulted or recalled (AGENTS.md §1-3).

[package]
name = "ldap-front"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "ldap_front"
path = "src/lib.rs"

[[bin]]
name = "ldap-front"
path = "src/main.rs"

[dependencies]
# tokio — owner decision P-12, the asynchronous runtime for the network
# side. Linked, never copied; only its docs.rs API pages were read (P-2).
# Version 1.54.1; license MIT (docs/50 §0.3). Features: the subset the other
# daemons use (docs/50 §10 P0's list, never `macros` or `full`):
#   rt      — `runtime::Builder::new_current_thread`, `spawn`;
#   net     — `net::TcpListener` / `net::TcpStream` (`from_std`),
#             `net::UnixStream` (`connect`, `peer_cred`);
#   time    — `time::timeout`, `time::sleep`;
#   sync    — `sync::Semaphore`, `sync::Notify`;
#   io-util — `AsyncReadExt::read`, `AsyncWriteExt::{write_all, shutdown}`.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
# rustls — approved by name (OD-9; docs/50 R50-11; owner item P-21: proceed
# with the default aws-lc-rs provider). Latest stable 0.23.x (0.23.46, not
# the 0.24 pre-release); license "Apache-2.0 OR ISC OR MIT". Features
# exactly as docs/50 §5.1: `default-features = false` (no `tls12`, no
# `logging`, no `prefer-post-quantum` reordering, no `brotli` / `zlib`
# certificate compression, no `fips` — P-15), plus `std` (the buffered
# `ServerConnection`) and `aws_lc_rs` (the provider, passed explicitly with
# `builder_with_provider`, never installed as a process default).
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
# aws-lc-rs — the crypto provider under rustls (OD-9; P-21). Not called
# directly by the product code: the direct dependency exists only to turn on
# its `non-fips` feature, which aws-lc-rs documents as "a compile-time
# guarantee that your build is using the non-FIPS cryptographic module" and
# "mutually exclusive with the fips feature — enabling both will result in a
# compile-time error" (docs.rs aws-lc-rs 1.19.0 crate root). The FIPS module
# (aws-lc-fips-sys) carries an OpenSSL license outside the AGENTS.md §7
# allowlist (docs/questions/Q-210, owner item P-15), so it must never enter
# the build. Version 1.19.0; license "ISC AND (Apache-2.0 OR ISC)". Building
# it compiles C (aws-lc-sys): a C compiler is required (scripts/install-
# deps.sh checks it; P-21).
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["non-fips"] }
# RustCrypto `zeroize` (OD-9; already in the lock): the cleartext LDAP
# buffer, the key file's octets and the canonical messages are wiped.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Our own workspace crates (path dependencies).
#
# The LDAP codec: `frame_length` with the framing state, the wire decode
# options, the canonical encoder, the Notice of Disconnection.
parse-ldap = { path = "../parse-ldap" }
# The ldap-front ↔ dird channel: `FrontChannel`, `ChannelFailure`,
# `TransportFacts`, the reply bound (A-70).
ipc-ldap = { path = "../ipc-ldap" }
# Framing of the dird and audit channels' replies (`FrameReader`).
ipc = { path = "../ipc" }
# The audit channel's `Ping` for the start-up verification of auditd
# (docs/50 R50-16, §7.5); no event conversion (A-66: no feature).
ipc-audit = { path = "../ipc-audit", default-features = false }
# `LdapFrontSettings`.
config = { path = "../config" }
# `HardeningPlan`, `SingleThreadProof`, `apply` (R50-14).
daemon-sandbox = { path = "../daemon-sandbox" }

[dev-dependencies]
# TESTS ONLY. Tier 2 runs the real dird (crates/directory-daemon tests/
# support, reused by `#[path]`) and the real auditd listener and writer
# (crates/audit-daemon tests/common, reused by `#[path]`), and compares the
# replies with the LDAP engine called in-process. Every one is a workspace
# crate or already in the lock. The client side of the TLS tests is rustls
# itself (docs/50 §9: "TLS client — rustls itself as client"), with the
# test's own ECDSA P-256 key generated through aws-lc-rs.
directory-daemon = { path = "../directory-daemon" }
audit-daemon = { path = "../audit-daemon" }
audit-log = { path = "../audit-log" }
ldap = { path = "../ldap" }
ipc-ldap-server = { path = "../ipc-ldap-server" }
directory-pip = { path = "../directory-pip" }
dirstore = { path = "../dirstore" }
ad-schema = { path = "../ad-schema" }
pdp = { path = "../pdp" }
dtyp = { path = "../dtyp" }
keyd = { path = "../keyd" }
keyd-types = { path = "../keyd-types" }
keyd-daemon = { path = "../keyd-daemon" }
ipc-keyd = { path = "../ipc-keyd" }
ipc-directory = { path = "../ipc-directory" }
krb-proto = { path = "../krb-proto" }
ipc-audit = { path = "../ipc-audit", features = ["ldap"] }

# Tier 3 (docs/50 R50-19): the hardening drop runs in a fresh child process
# of a binary with its own `main`, as the other daemons do.
[[test]]
name = "root_hardening"
harness = false

[lints]
workspace = true
