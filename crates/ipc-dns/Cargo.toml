# ipc-dns — the dnsd ↔ dird channel (`dird-dns.sock`): its message set, the
# zone-image transfer, the decoding dird's dispatcher uses, and dnsd's side of
# it — a synchronous client that checks dird's uid and the zone dird assigned
# before it sends anything (docs/54 §4.6, as amended by
# docs/research/r3-c-dns.md §4.1 and decision A-140; build task DN7).
#
# A library: no daemon, no listener, no directory, no key. dird runs the DNS
# PEP behind it (tasks DN8, DN10); dnsd (task DN11) links this crate as its
# client. THIS crate must never link dirstore / redb / directory-pip /
# directory-admin, keyd / keyd-types / ipc-keyd, krb-crypto / krb-proto, or
# ipc-dns-server: dnsd holds no key and no store and is not mapped in keyd
# (docs/54 §4.3, §4.7 — checked by tests/no_store_dependency.rs).
#
# Provenance: written only from docs/54 §4.3–§4.8, §6.1, §6.2, §10 (DN7),
# docs/research/r3-c-dns.md §4.1, §4.4, §5, §6 (W1, W21), decisions A-119,
# A-122, A-124, A-140, docs/50 §3.3, §3.6, §3.7 and the channel-magic
# registry, RFC 1035 §2.3.4, §3.1, §3.4.1, §4.2–§4.2.2, RFC 2136 §2.1, §3.5–
# §3.8, §6, §7.8, §7.11, RFC 3645 §2, §4, §4.1.1, RFC 8945 §4.3.2, §5.2,
# §5.2.1, §5.4, §5.5 (pinned copies, SHA-256 verified this session), the
# public API of this workspace's crates, and the docs.rs API pages of rustix
# 1.1.6 and zeroize 1.9.1 (P-2). No other implementation was consulted or
# recalled (AGENTS.md §1-3).

[package]
name = "ipc-dns"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own workspace crates (path dependencies).
#
# The framing, the envelope, the field primitives and the shared `Refused`
# reply (docs/50 §3.3; A-59).
ipc = { path = "../ipc" }
# `Name` (uncompressed wire form, RFC 1035 §3.1), `Transport`, and the
# message bounds the channel is pinned to (docs/54 §6.1, §6.2; A-122).
parse-dns = { path = "../parse-dns" }
# `ZoneImageParts` / `ZoneImage` (the typed zone image, validated by
# `ZoneImage::new`) and its bounds (docs/54 §4.4; A-124). Pure: no I/O; its
# only dependency is parse-dns.
dns-zone = { path = "../dns-zone" }
# RustCrypto `zeroize` (OD-9; already in the lock): forwarded message octets
# and the reply buffers of the blocking socket are wiped (docs/50 §3.3
# discipline).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# rustix — owner decision P-12 (already in the lock). Peer credentials of the
# client's blocking Unix socket (docs/50 R50-3: "the client verifies that the
# server's uid is the configured uid"; docs/54 §4.6). Linked, never copied;
# only its docs.rs API pages were read (P-2). Features per the docs.rs pages:
# `net` (`socket_peercred`), `std` (the `AsFd` the function takes). Linux
# only: elsewhere the peer check fails closed.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }

# No dev-dependency: the codec, image and client tests need only the crates
# above. The tests that run the client against dird's dispatcher live in
# crates/ipc-dns-server.

[lints]
workspace = true
