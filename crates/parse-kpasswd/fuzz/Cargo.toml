# cargo-fuzz harness for parse-kpasswd (docs/CLEAN-ROOM.md / docs/32 §8: every parser
# gets a fuzz target before it merges to main; docs/53 §5.9).
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run parse_kpasswd_request` / `cargo fuzz run parse_kpasswd_reply`
# (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# docs/CLEAN-ROOM.md). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "parse-kpasswd-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.parse-kpasswd]
path = ".."

# `RequestMessage::parse` / `parse_tcp` and `tcp_message_length` on arbitrary
# bytes, with the invariant and re-encoding properties
# (`cargo fuzz run parse_kpasswd_request`).
[[bin]]
name = "parse_kpasswd_request"
path = "fuzz_targets/parse_kpasswd_request.rs"
test = false
doc = false
bench = false

# `ReplyMessage::parse` / `parse_tcp` on arbitrary bytes, with the same
# properties (`cargo fuzz run parse_kpasswd_reply`).
[[bin]]
name = "parse_kpasswd_reply"
path = "fuzz_targets/parse_kpasswd_reply.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
