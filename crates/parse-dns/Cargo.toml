# parse-dns — the strict, bounded DNS message codec (docs/54 R54-7, §6.1–§6.3;
# build task DN1, decision A-119).
#
# A network-facing parser crate: dnsd decodes every datagram / TCP message with
# it, and dird decodes the forwarded UPDATE octets with the SAME crate and the
# same bounds (docs/54 §4.1, §6.1). It also encodes the server's replies,
# canonically and without compression (docs/54 §6.3).
#
# Leaf crate: ZERO runtime dependencies (hand-rolled error enum), nothing to
# link and nothing for cargo-deny to license-check here (AGENTS.md §7).
# Written only from RFC 1034 §3.1, §3.6; RFC 1035 §2.3.1–§2.3.4, §3.1–§3.4.1,
# §4.1–§4.2.2; RFC 2136 §1.1, §1.3, §2–§2.6, §3.4.1, §3.8; RFC 2782; RFC 3645
# §5.1, §8; RFC 8945 §3, §4.1–§4.3.3, §5.1–§5.3.2, §6; and docs/54 — opened
# in-session (AGENTS.md §1-3).

[package]
name = "parse-dns"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# intentionally empty — zero runtime dependencies (AGENTS.md §7; docs/54 §6.1).

[lints]
workspace = true
