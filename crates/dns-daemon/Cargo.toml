# dns-daemon — dnsd, the DNS network front (docs/54 §4, R54-4; build task
# DN11; decisions A-119, A-140, A-152, A-154): UDP and TCP listeners on the
# configured internal interface addresses (RFC 1035 §4.2.1, §4.2.2; docs/54
# §4.7), only for sources inside `internal_networks` (A-114), per-source
# limits through the shared rate-limit crate (A-154), bounded TCP
# connections and timeouts (docs/54 §6.7), answers from the zone image it
# fetches from dird over `dird-dns.sock` and refreshes by SERIAL — and
# none at all while the image is stale or was never fetched (docs/54 §4.4,
# §4.8) — signed UPDATE messages handed to dird with the transport and the
# source address, dird's reply relayed (A-140), auditd verified first
# (docs/50 R50-16), hardening before any thread exists (R50-14).
#
# Holds no key, no store and no keyd channel (docs/54 §4.3, R54-4: "no
# key, no dirstore, and no access to keyd at all"): see
# tests/no_store_or_keyd.rs.
#
# Written only from this project's decided design (docs/54 §3–§4.8, §6,
# §8–§10; docs/research/r3-c-dns.md §4.1, §5, §6; docs/50 R50-3, R50-14,
# R50-16, §3.6, §4.1, §6, §7.5, §8.2, §9; docs/07 §1, §8; docs/questions
# Q-616, Q-619, Q-671, Q-672, Q-920, Q-921, Q-922, Q-930 and PENDING-OWNER
# A-114, A-119, A-122, A-124, A-140, A-149, A-152, A-154), RFC 1035 §2.3.4,
# §4.2, §4.2.1, §4.2.2, RFC 2136 §2.1, §3.5–§3.8, §6, §7.8, §7.9 and RFC
# 8945 §5.5 (pinned copies, SHA-256 verified this session), the public API
# of the workspace crates named below, and the docs.rs API pages of tokio
# 1.54.1 (API documentation only, never source — PENDING-OWNER P-2). No
# other implementation, DNS server, daemon or server framework was
# consulted or recalled (docs/CLEAN-ROOM.md).

[package]
name = "dns-daemon"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "dns_daemon"
path = "src/lib.rs"

[[bin]]
name = "dns-daemon"
path = "src/main.rs"

[dependencies]
# tokio — owner decision P-12, the asynchronous runtime for the network
# side. Linked, never copied; only its docs.rs API pages were read (P-2).
# Version 1.54.1; license MIT (docs/50 §0.3) — on the docs/CLEAN-ROOM.md
# allowlist; already in the lock. Features: the subset the other daemons
# use (docs/50 §10 P0's list, never `macros` or `full`):
#   rt      — `runtime::Builder::new_current_thread`, `spawn`, `JoinSet`;
#   net     — `net::UdpSocket`, `net::TcpListener`, `net::TcpStream`
#             (`from_std`), `net::UnixStream` (the audit check);
#   time    — `time::timeout`, `time::sleep`;
#   sync    — `sync::{mpsc, oneshot, Notify}` (the forwarding queue);
#   io-util — `AsyncReadExt::read`, `AsyncWriteExt::write_all`.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
# Our own workspace crates (path dependencies).
#
# The zone image and the answer function: every request maps to exactly one
# verdict, every reply is built (and size-bounded) there (A-124). Its only
# dependency is parse-dns.
dns-zone = { path = "../dns-zone" }
# The dird-dns channel's client side: `DnsClient` with `ExpectedDird`, the
# Unix connector (rustix peer credentials, Linux), `ForwardRequest`,
# `PeerAddress`, `DnsMessage` (A-152). Its guard proves it links no store,
# keyd or Kerberos crypto.
ipc-dns = { path = "../ipc-dns" }
# The per-source + global admission limiter shared with the kdc (task DN3,
# A-154 item 6 (a)): used as is, keyed by the IPv4 address / IPv6 /64. A
# leaf: no dependency at all.
rate-limit = { path = "../rate-limit" }
# The audit channel's `EventSource::Dnsd` (the source auditd must record
# dnsd under — task DN12) and `WindowConfig`; no event conversion — dnsd's
# only events are the window's `WindowSummary` counters (docs/54 §9). Since
# task IB1 its only dependency is crate ipc (A-149).
ipc-audit = { path = "../ipc-audit" }
# The one audit client (task R9b; crate ipc-audit-client since task IB1):
# auditd's uid and reported source verified at start (docs/50 R50-16), and
# the gate + link that deliver the noise counters. Its tokio is the one this
# daemon links.
ipc-audit-client = { path = "../ipc-audit-client" }
# `DnsdSettings`, `Network`, `is_internal` (the one address match, A-114).
config = { path = "../config" }
# `HardeningPlan`, `SingleThreadProof`, `apply` (R50-14).
daemon-sandbox = { path = "../daemon-sandbox" }
# The protected-file reader (task F7): the configuration file is inspected
# without following a link, opened with O_NOFOLLOW and checked on the opened
# descriptor. rustix inside (P-12), already in the lock.
protected-file = { path = "../protected-file" }

[features]
# docs/52 C18 (task R15): the test seams — the module `test_seams` (the full
# parameters, the generic `serve`) — exist only in a build that asks for them.
# Only `[dev-dependencies]` enable this feature (cargo's resolver 2 turns a
# dev-dependency's features on only in builds of test targets), so no product
# build of the daemon contains a seam. Never in `default`.
test-seams = []

[dev-dependencies]
# TESTS ONLY (docs/52 C18, task R15): this crate's own tests use its test
# seams (`test_seams`).
dns-daemon = { path = ".", features = ["test-seams"] }
# TESTS ONLY: dird's side of the channel — the tests' fake dird is the real
# dispatcher (`DnsConnection`) over an in-process loopback, with a test
# `ZoneHost` (docs/54 §4.6; the pattern of crates/ipc-dns-server
# tests/dispatch.rs). A workspace crate; never a normal dependency (the
# guard checks it).
ipc-dns-server = { path = "../ipc-dns-server" }
# TESTS ONLY: framing for the loopback connection and the fake auditd.
ipc = { path = "../ipc" }
# TESTS ONLY: the requests the tests send are encoded by our own codec, and
# the replies decoded by it (RFC 1035 §4.1; A-122).
parse-dns = { path = "../parse-dns" }
# TESTS ONLY: the loopback connection returns reply bodies in the zeroizing
# buffer ipc-dns's `Connection::receive` returns (RustCrypto `zeroize`,
# OD-9; already in the lock and in ipc-dns's graph).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# TESTS ONLY: scratch directories inside the workspace for the start-up
# tests whose configuration file crates/protected-file reads (task T;
# docs/questions/Q-480). No dependency.
test-scratch = { path = "../test-scratch" }
# TESTS ONLY (task DN12): tests/audit.rs runs the product start against the
# real auditd listener and writer (crates/audit-daemon tests/common, reused
# by `#[path]` as crates/ldap-front's tests do) and reads its log. Workspace
# crates, already in the lock; never normal dependencies (the guard
# tests/no_store_or_keyd.rs checks the normal graph).
audit-daemon = { path = "../audit-daemon" }
audit-log = { path = "../audit-log" }

[lints]
workspace = true
