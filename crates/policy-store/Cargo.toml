# policy-store — the shared policy file both dird and the kdc load at start
# (decision A-68, docs/questions/Q-270 item 2; docs/50 §7.2: "kdc and dird
# load the **same** file at start"): the UNSIGNED development format only,
# moved from crates/directory-daemon (format 1: the tier map) and extended
# (format 2) with the PDP rule set, the anonymous allowlist and the
# mandatory-FAST bootstrap group (A-39, P-10). The signed format of Q-219
# (A-57) is not defined yet.
#
# Deliberately light: no directory-pip / dirstore / redb (the kdc links this
# crate and must not link the store — docs/50 R50-2, A-68), no crypto (D182).
# dird builds its `directory_pip::TierMap` from the entries itself.
#
# Written only from this project's decided design (docs/50 §3.3, §7.2, §9;
# docs/06 §9; docs/11 §3, §6; docs/47 §6.3; docs/48 §7; docs/questions
# Q-130, Q-164, Q-170, Q-219, Q-270 and PENDING-OWNER A-36, A-39, A-48,
# A-51, A-57, A-68) and the public API of the workspace crates named below
# — AGENTS.md §1-3. No other implementation, policy language or serializer
# was consulted or recalled.

[package]
name = "policy-store"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Our own workspace crates only (path dependencies); no external crate of
# its own (rustix comes in through protected-file).
#
# The bounded field primitives (`Reader`, `Writer`, `FrameLimit`): the file
# keeps "the discipline of the IPC codec" (A-57, docs/50 §3.3).
ipc = { path = "../ipc" }
# The rule model (`Rule`, `Match`, `AnonymousGrant`, `SubtreeBase`,
# `PolicySnapshot`, `mandatory_fast_rules`, `Tier`, `Dn`).
pdp = { path = "../pdp" }
# SIDs ([MS-DTYP] 2.4.2.2) and GUIDs ([MS-DTYP] 2.3.4).
dtyp = { path = "../dtyp" }
# The protected-file reader (task F7, A-86 follow-up): the policy file is
# inspected without following a link, opened with O_NOFOLLOW and checked on
# the opened descriptor. rustix inside (P-12), already in the lock.
protected-file = { path = "../protected-file" }

[dev-dependencies]
# The scratch directories, inside the workspace, of the tests whose files a
# crates/protected-file reader opens — the walk from `/` accepts them (task
# T; docs/questions/Q-480). Dev-only, no dependency.
test-scratch = { path = "../test-scratch" }

[lints]
workspace = true
