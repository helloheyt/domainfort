# cargo-fuzz harness for the shared policy-store parser (AGENTS.md §6: every
# parser gets a fuzz target before it merges to main; docs/50 §9 / R50-19
# names `policy_store`; A-68 moved the parser here from dird — the UNSIGNED
# development format 2).
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run policy_store` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# AGENTS.md §7). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "policy-store-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.policy-store]
path = ".."

# An arbitrary file through `DevelopmentPolicy::decode` (bounded, strict),
# with the canonical round-trip property and the snapshot
# (`cargo fuzz run policy_store`).
[[bin]]
name = "policy_store"
path = "fuzz_targets/policy_store.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
