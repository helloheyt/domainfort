# ipc-audit — the audit channel (`audit.sock`) message set over `ipc`, the
# canonical event encoding for the kdc / keyd / ldap audit shapes and the
# admin-plane `DirAdmin` / `Admind` shapes (docs/51 §5.7, task A7), and the
# sender-side bounded window that implements the decided overflow policy
# (docs/50 R50-17, §8.1, §10 task P6 — the library half; docs/questions/Q-218,
# A-57).
#
# One dependency, this project's `ipc` (framing, codec primitives, shared
# `Refused`), and NO feature: docs/50 §10 lists only `ipc` for this crate
# (docs/questions/Q-252 item 1). auditd (P6b) links only this crate.
#
# Task IB1 (docs/questions/Q-851, decision A-144; class C40, docs/research/
# r4-b §3.3, §5.6). Until then this crate declared the source crates (kdc,
# keyd, ldap, pdp, krb-proto, dtyp, parse-ldap) and tokio as OPTIONAL
# dependencies behind the features `kdc`, `keyd`, `ldap` and `client`. The
# old comment here (A-66) promised that, with none of them on by default,
# "building the whole workspace no longer unifies the kdc / ldap conversions
# into auditd or any other daemon". That was wrong: cargo unifies the
# features of one package across everything built together, so in any
# shared build (`cargo build --all`, `-p a -p b`) every daemon that linked
# ipc-audit got all three conversions and their source crates — keyd,
# krb-crypto (AES, SHA-1, PBKDF2), dirstore and redb — whatever it asked
# for. A default-off feature does not isolate; only the crate graph does.
# Now no manifest in the workspace declares an `optional` dependency, and
# features are cfg-only (`= []`). The conversions moved to the side that
# already links each source crate (crates/kdc-daemon, crates/ipc-keyd-server,
# crates/directory-daemon — each an `audit_convert` module), and the client,
# with the gate it drives, to crate ipc-audit-client (non-optional tokio).
#
# Written only from this project's decided design (docs/50, docs/37,
# docs/07 §8, docs/questions/Q-218 / A-57, docs/questions/Q-225 / A-59,
# Q-265 / A-66, Q-851 / A-144) and the public API of crate ipc — AGENTS.md
# §1-3. No other implementation, serializer, RPC framework or audit format
# was consulted or recalled.

[package]
name = "ipc-audit"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Framing, field primitives, the `MessageSet` pattern and `REFUSED_KIND`.
ipc = { path = "../ipc" }

[dev-dependencies]
# TESTS ONLY: this project's schema crate, so that a test checks the six
# `GroupTypeCode` values against `ad_schema::flags::group_type::ALLOWED_VALUES`
# — the repository's one statement of the phase-1 groupType values
# ([MS-ADTS] 2.2.12 as cited there; docs/46 §8.2) — instead of trusting a
# second copy (docs/questions/Q-340 item 5). A workspace path crate, no
# third-party dependency; dev-dependencies are not linked into any daemon.
ad-schema = { path = "../ad-schema" }

[lints]
workspace = true
