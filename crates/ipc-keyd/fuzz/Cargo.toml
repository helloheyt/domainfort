# cargo-fuzz harness for ipc-keyd (AGENTS.md §6: every parser gets a fuzz
# target before it merges to main; docs/50 §9 / R50-19: "fuzz targets …
# `ipc_keyd_request`, `ipc_keyd_reply` (the client decodes replies)").
#
# This is a SEPARATE workspace (note the empty [workspace] table below): it is
# intentionally NOT a member of the root workspace, so `cargo build --all`,
# `cargo clippy`, `cargo test`, `cargo deny` and the SBOM in the product
# workspace never pull in the fuzzing-only dependencies. It is built only via
# `cargo fuzz run ipc_keyd_request` / `cargo fuzz run ipc_keyd_reply` /
# `cargo fuzz run ipc_keyd_install_attestation_key` (nightly + cargo-fuzz).
#
# NOTE FOR REVIEW: libfuzzer-sys is fuzz-harness-only test infrastructure, not
# linked into any product crate, and on the license allowlist (MIT / Apache-2.0,
# AGENTS.md §7). Pending owner sign-off (docs/questions/PENDING-OWNER.md P-1);
# not built or run until then.

[package]
name = "ipc-keyd-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ipc]
path = "../../ipc"

[dependencies.ipc-keyd]
path = ".."

[dependencies.keyd]
path = "../../keyd"

# Server side: an arbitrary request body through the ipc layer and krb-proto
# (`ipc_keyd::decode_request`), with the canonical round-trip property
# (`cargo fuzz run ipc_keyd_request`).
[[bin]]
name = "ipc_keyd_request"
path = "fuzz_targets/ipc_keyd_request.rs"
test = false
doc = false
bench = false

# Task PN9: the payload of `install_attestation_key` (kind 0x1A) alone,
# behind a fixed envelope, so every mutation lands in the key field
# (`cargo fuzz run ipc_keyd_install_attestation_key`).
[[bin]]
name = "ipc_keyd_install_attestation_key"
path = "fuzz_targets/ipc_keyd_install_attestation_key.rs"
test = false
doc = false
bench = false

# Client side: an arbitrary reply body to a call of an input-chosen operation
# (`ipc::decode_reply` then `Answer::from_wire`), with the canonical
# round-trip property (`cargo fuzz run ipc_keyd_reply`).
[[bin]]
name = "ipc_keyd_reply"
path = "fuzz_targets/ipc_keyd_reply.rs"
test = false
doc = false
bench = false

# Detach from the root workspace (see header).
[workspace]
