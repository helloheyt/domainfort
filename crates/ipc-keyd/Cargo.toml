# ipc-keyd — the keyd channel (keyd.sock): its message set, the server-side
# request decoding / answer encoding, and the synchronous client that
# implements `KeyCustody` (docs/50 §3.1-§3.7, §10 "P5", R50-3..R50-8; decision
# A-58).
#
# A library: no daemon, no queue, no listener (keyd-daemon is task P7, the kdc
# daemon task P9). The client speaks through a small connection trait so that
# tests use an in-process loopback and the daemons a blocking Unix stream
# socket. The dispatcher that calls the real keyd (`execute`, `dispatch`) is
# the separate crate `ipc-keyd-server`, linked only by the keyd-daemon: this
# crate is the kdc's side of the channel and must never link keyd or
# krb-crypto (D182; decision A-63, docs/questions/Q-245 item 3). Checked by
# crates/keyd-types/tests/no_crypto_dependency.rs.
#
# Written only from this project's decided design — docs/50 (§3, §8.2, §9,
# §10, closing decision A-58), docs/10 (§1-§12), docs/questions Q-217 / Q-222
# (A-56), Q-225 (A-59), Q-240 (A-62), Q-245 (A-63) and PENDING-OWNER
# (A-56..A-63, P-1, P-2, P-12) — the code of this project's own crates (ipc,
# keyd, keyd-types, kdc, krb-proto, krb-crypto), and the docs.rs API pages of
# rustix 1.1.6 (`net` module, `net::sockopt::socket_peercred`, `net::UCred`,
# `fs::Uid`, `fd::AsFd`) and zeroize 1.9.1 (`Zeroizing`) — API documentation
# only, never their source (P-2). No other implementation, serializer or RPC
# framework was consulted or recalled (docs/CLEAN-ROOM.md).

[package]
name = "ipc-keyd"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The framing, the envelope, the field primitives and the shared `Refused`
# reply (docs/50 §3.3; A-59).
ipc = { path = "../ipc" }
# keyd's crypto-free types: the operations' argument and result types, the
# caller identity, the error enums, `EncTypeId` (etype number <-> identifier)
# and the `KeyCustody` seam the client implements (docs/10; docs/50 §10, row
# `ipc-keyd`). NOT keyd and NOT krb-crypto: the client side links no crypto
# code (D182; A-63 — closes docs/questions/Q-245 item 3).
keyd-types = { path = "../keyd-types" }
# Only for `kdc::MAX_REQUEST_LEN`, to which the per-field request bound is
# pinned at compile time (src/channel.rs). kdc links no krb-crypto (D182).
kdc = { path = "../kdc" }
# Strict DER decoding / canonical encoding of every Kerberos value on the
# wire (docs/50 §3.3, "Kerberos values ... decoded in krb-proto").
krb-proto = { path = "../krb-proto" }
# RustCrypto `zeroize` (OD-9 / D180; already in the lock): the buffers that
# carry the passwords of `set_secret` / `verify_secret` (docs/50 §3.3).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# rustix — owner decision P-12. Peer credentials of the client's blocking Unix
# socket (docs/50 R50-3: "rustix `socket_peercred` in the synchronous
# client"). Linked, never copied; only its docs.rs API pages were read (P-2).
# License as recorded in docs/50 §0.3 ("Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT", satisfied by the plain alternatives, docs/CLEAN-ROOM.md).
# Features, per the docs.rs pages read: `net` — `net::sockopt::socket_peercred`
# ("Available on linux_kernel and crate feature net only") and `net::UCred`;
# `std` — the `fd::AsFd` the function takes is std's, implemented by
# `std::os::unix::net::UnixStream`. Linux only: elsewhere the peer check fails
# closed (src/unix.rs).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }

# No dev-dependency: the codec tests (tests/messages.rs, tests/samples) need
# only keyd-types, krb-proto and zeroize. The tests that need the real keyd
# behind the dispatcher moved with it to crates/ipc-keyd-server (D182; A-63).

[lints]
workspace = true
