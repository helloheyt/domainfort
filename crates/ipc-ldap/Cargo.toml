# ipc-ldap — the ldap-front ↔ dird channel (`dird-ldap.sock`): its message
# set, the front's side of it (a sans-I/O channel state machine and a
# blocking client over a Unix stream socket), and the Notice of Disconnection
# the front sends when dird does not serve (docs/50 R50-10, §3.3, §4.2, §4.3,
# §10 "P10"; docs/49 R49-16; decision A-58).
#
# A library: no daemon, no listener (dird hosts the service, crates/
# directory-daemon; the front is task P11). The server half — the dispatcher
# over an `ldap::Engine` and a per-connection `ldap::Session` — is the
# separate crate `ipc-ldap-server`, linked only by dird: THIS crate is the
# front's side and must never link the LDAP engine, dirstore / redb or
# directory-pip (docs/49 R49-16: "ldap-front — TLS + parse-ldap, no
# dirstore / keyd"; docs/25 §3.3: a compromised ldap-front gets no direct
# access to dirstore or keyd). Checked by tests/no_engine_dependency.rs.
#
# Written only from this project's decided design — docs/50 (R50-3, R50-4,
# R50-7, R50-8, R50-10, R50-13, §3.1-§3.7, §4.2, §4.3, §8.2, §9, §10, the
# channel-magic registry), docs/49 (R49-6, R49-15, R49-16, §4.3, §4.4, §11),
# docs/questions Q-163 (A-47), Q-190 (A-54), Q-200 (A-55), Q-225 (A-59),
# Q-270 (A-68), Q-275 (A-69), PENDING-OWNER — the code of this project's own
# crates (ipc, parse-ldap; ipc-directory as the pattern), RFC 4511 §4.4.1
# and App. A (pinned, sha256 49c6aab6…06fd), and the docs.rs API pages of
# rustix 1.1.6 (`net::sockopt::socket_peercred`, `net::UCred`, `fs::Uid`)
# and zeroize 1.9.1 (`Zeroizing`) — API documentation only, never their
# source (P-2). No other implementation, LDAP server, serializer or RPC
# framework was consulted or recalled (docs/CLEAN-ROOM.md).

[package]
name = "ipc-ldap"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The framing, the envelope, the field primitives and the shared `Refused`
# reply (docs/50 §3.3; A-59).
ipc = { path = "../ipc" }
# The LDAP codec's bounds (`MAX_AUTH_MESSAGE_OCTETS`), the framing state the
# front applies (`AuthState`), and the Notice of Disconnection the front
# sends when dird does not serve (`LdapMessage::notice_of_disconnection`,
# `encode_message`). A leaf crate: no runtime dependency (docs/50 §10: the
# `ipc-ldap` row lists `ipc, parse-ldap`).
parse-ldap = { path = "../parse-ldap" }
# RustCrypto `zeroize` (OD-9; already in the lock): the canonical message and
# reply buffers are wiped (docs/50 §3.3 discipline; a bind may carry a SASL
# token).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# rustix — owner decision P-12. Peer credentials of the front's blocking
# Unix socket (docs/50 R50-3: "the client verifies that the server's uid is
# the configured uid of keyd / dird"). Linked, never copied; only its docs.rs
# API pages were read (P-2). License as recorded in docs/50 §0.3 (MIT /
# Apache-2.0 alternatives, docs/CLEAN-ROOM.md). Features per the docs.rs pages:
# `net` (`socket_peercred`, "Available on linux_kernel and crate feature net
# only"), `std` (the `AsFd` the function takes). Linux only: elsewhere the
# peer check fails closed.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "net"] }

# No dev-dependency: the codec and client tests need only the crates above.
# Tests that need the engine behind the dispatcher live in
# crates/ipc-ldap-server and crates/directory-daemon.

[lints]
workspace = true
