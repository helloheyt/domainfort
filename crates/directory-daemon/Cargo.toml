# directory-daemon (dird) — the directory process (docs/50 §10 tasks P8 and
# P10; decision A-58): the only process that opens the redb file and holds
# the dirstore IntegrityKey (R50-2; Q-213 → A-57), serving `dird-kdc.sock`
# to the kdc's uid only (R50-3), one snapshot pinned per connection (§3.4),
# and `dird-ldap.sock` to ldap-front's uid only — the LDAP engine (the PEP)
# hosted here, one session per channel connection (R50-10; docs/49 R49-16),
# its events audited through auditd (R50-17); hardening before any thread
# exists (R50-14), auditd verified first (R50-16), the DEVELOPMENT
# integrity-key file and the UNSIGNED development policy store only
# (docs/questions/Q-270). The admin channel is task P13.
#
# Written only from this project's decided design (docs/50, docs/49, docs/47
# §8, docs/questions Q-163, Q-190, Q-200, Q-213, Q-214, Q-218..Q-220, Q-230,
# Q-235, Q-245, Q-252, Q-255, Q-260, Q-265, Q-270, Q-275, Q-280 and
# PENDING-OWNER), the public API of the workspace
# crates named below, and the docs.rs API pages of tokio 1.54.1 (API
# documentation only, never source — PENDING-OWNER P-2). No other
# implementation, directory server, daemon or RPC system was consulted or
# recalled (AGENTS.md §1-3).

[package]
name = "directory-daemon"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "directory_daemon"
path = "src/lib.rs"

[[bin]]
name = "directory-daemon"
path = "src/main.rs"

[dependencies]
# tokio — owner decision P-12, the asynchronous runtime for the socket side.
# Linked, never copied; only its docs.rs API pages were read (P-2). Version
# 1.54.1; license MIT (docs/50 §0.3) — on the AGENTS.md §7 allowlist.
# Features: the subset keyd-daemon uses, from docs/50 §10 P0's list (never
# `macros` or `full`):
#   rt      — `runtime::Builder::new_current_thread`, `spawn`;
#   net     — `net::UnixListener`, `net::UnixStream` (`peer_cred`, `UCred`);
#   time    — `time::timeout`, `time::sleep`;
#   sync    — `sync::oneshot` (the engine's reply), `sync::Notify` (stop);
#   io-util — `AsyncReadExt::read`, `AsyncWriteExt::write_all`.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
# RustCrypto `zeroize` (OD-9; already in the lock): the integrity key's
# reading buffers, and the request buffers (ipc discipline).
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# Our own workspace crates (path dependencies).
#
# Framing (`FrameReader`), the shared `Refused`.
ipc = { path = "../ipc" }
# The shared policy file (A-68: moved here from this crate; the same file
# the kdc loads, docs/50 §7.2).
policy-store = { path = "../policy-store" }
# The directory-view channel: `REQUEST_LIMIT`, the code tables.
ipc-directory = { path = "../ipc-directory" }
# The server side over the real directory (only this daemon depends on it).
ipc-directory-server = { path = "../ipc-directory-server" }
# The audit channel (auditd verified first, R50-16) and the LDAP engine's
# events (R49-14, R50-17): the `ldap` conversion only — each daemon enables
# only the conversion it sends (A-66).
ipc-audit = { path = "../ipc-audit", features = ["ldap"] }
# The LDAP engine — the PEP hosted in dird (docs/50 R50-1, R50-10; docs/49
# R49-16): `Engine`, `RequestInputs`, the audit event.
ldap = { path = "../ldap" }
# The ldap-front ↔ dird channel: `REQUEST_LIMIT`, the message set.
ipc-ldap = { path = "../ipc-ldap" }
# The channel's server side: the dispatcher over the engine and a
# per-connection session (only this daemon depends on it).
ipc-ldap-server = { path = "../ipc-ldap-server" }
# The view, the context, the tier map, the naming context.
directory-pip = { path = "../directory-pip" }
# The store and the integrity key.
dirstore = { path = "../dirstore" }
# The phase-1 schema the store is opened with.
ad-schema = { path = "../ad-schema" }
# `KeydConfig` (realm, enctypes, s2kparams for the account records).
keyd-types = { path = "../keyd-types" }
# `Realm`.
krb-proto = { path = "../krb-proto" }
# `PolicyVersion`.
pdp = { path = "../pdp" }
# `DirdSettings`.
config = { path = "../config" }
# `HardeningPlan`, `SingleThreadProof`, `apply` (R50-14).
daemon-sandbox = { path = "../daemon-sandbox" }
# The protected-file reader (task F7, A-86 follow-up): every file read as
# root before the drop is inspected without following a link, opened with
# O_NOFOLLOW and checked on the opened descriptor. rustix inside (owner
# decision P-12), already in the lock — no new package.
protected-file = { path = "../protected-file" }
# The admin channel (task A8, docs/51 §7): codec, server-side decoding,
# reply encoding.
ipc-dird-admin = { path = "../ipc-dird-admin" }
# The admin plane's write PEP (A-89): prepare / apply, the audit events it
# plans. Links no crypto (its own D182 guard).
directory-admin = { path = "../directory-admin" }
# dird's keyd client under Role::Ldap (A-73): `KeydClient`,
# `open_and_verify_service_ticket`, `describe_config`, the Unix connector.
# The client side of the keyd channel links no crypto (A-63).
ipc-keyd = { path = "../ipc-keyd" }
# The provisioning manifest (root-owned, non-secret): the admin service
# object and the service objects dird protects (docs/51 §4.3 step 8).
provision-manifest = { path = "../provision-manifest" }
# `AccountSource::service`: the admin service's key set resolved as the KDC
# resolves a service principal (docs/47 §1.3). kdc links no crypto (D182).
kdc = { path = "../kdc" }
# `Guid` of the protected service objects.
dtyp = { path = "../dtyp" }

[dev-dependencies]
# TESTS ONLY. The end-to-end flow runs the real keyd daemon
# (`keyd_daemon::serve` through crates/keyd-daemon/tests/support, reused by
# `#[path]`) and the kdc with `ipc_keyd::IpcKeyd` and this channel's client;
# it reuses the kdc integration fixtures (crates/kdc/tests/common, the
# Kerberos client side with krb-crypto) as crates/keyd-daemon does. Every one
# is a workspace crate or already in the lock.
keyd-daemon = { path = "../keyd-daemon" }
keyd = { path = "../keyd" }
krb-crypto = { path = "../krb-crypto" }
# The LDAP requests the tier-2 LDAP tests build and the responses they read
# (crates/parse-ldap, the canonical codec — tests/ldap_service.rs).
parse-ldap = { path = "../parse-ldap" }

# Tier 3 (docs/50 R50-19): the hardening drop runs in a fresh child process of
# a binary with its own `main`, as crates/keyd-daemon does.
[[test]]
name = "root_hardening"
harness = false

[lints]
workspace = true
