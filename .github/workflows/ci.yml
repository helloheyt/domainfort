name: ci
# Phase-0 CI — the third enforcement layer (docs/CLEAN-ROOM.md, "Enforcement"). A failure does not merge into main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  provenance:
    name: clean-room provenance (trailers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Spec-Ref / Clean-Room trailers
        run: bash scripts/check-provenance.sh "origin/${{ github.base_ref || 'main' }}"
      - name: No vendored / foreign-licensed / copied code
        run: bash scripts/check-no-vendor.sh

  specs-pinned:
    name: spec manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      # Verifies that each pinned sha256 still matches its source (docs/CLEAN-ROOM.md, "Pinned specifications").
      - run: bash scripts/pin-specs.sh --verify

  deps:
    name: cargo-deny (licenses + banned deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  rust:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The exact version pinned in rust-toolchain.toml (keep the two equal).
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { components: "rustfmt, clippy" }
      # One gate that recognises an empty workspace (phase 0) → no-op, and takes effect automatically with
      # the first crate. (Before this, the direct steps failed on "no members".)
      - run: bash scripts/check-rust.sh

  sbom:
    name: SBOM (supply-chain provenance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      # no-op while there are no crates; produces CycloneDX once there are (D61, R13).
      - run: bash scripts/gen-sbom.sh
